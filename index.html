    v.innerHTML=`<div class="empty"><b>등록된 월간 데이터가 없습니다.</b>
      Data Management에서 Excel 파일을 추가하십시오.<br><br>
      <button class="btn pri hide-exec" onclick="App.tab('data')">Excel 데이터 추가</button></div>`;
    return;
  }
  const {y,m}=S.sel;
  const doc=S.months[mkey(y,m)];
  const tt=teamTable(doc, "전체", "기본순서");        // KPI/Insight용
  const ttf=teamTable(doc, "전체", S.sort);            // Chart용 (정렬 적용)
  const fs=finSummary(y,m);
  const rs=ratioSeries(y);
  const pv=prevPeriod(y,m), prevDoc=S.months[mkey(pv.y,pv.m)];
  const prev=prevDoc?teamTable(prevDoc,"전체","기본순서"):null;

  /* KPI */
  const kpi=[];
  {
    const p=tt.division["수행"]?tt.division["수행"].pct:null;
    let sub="전월 데이터 없음";
    if(p!=null && prev && prev.division["수행"]) sub="전월 대비 "+pp1(p-prev.division["수행"].pct);
    kpi.push({l:"수행 WORKLOAD", v:pct1(p), u:"", s:sub, c:""});
  }
  const rCost=fs.rows[0], rSga=fs.rows[1], rAdm=fs.rows[2];
  /* 증감 색: posGood=true면 +가 긍정(파랑)/-가 부정(빨강), false면 반대 */
  const signCls=(d,posGood)=> (d==null||d===0)?"" :
    (d>0 ? (posGood?"blue":"red") : (posGood?"red":"blue"));
  {
    /* 공사원가율(인건비) = 원가 / (원가+판관비) — +가 긍정 */
    const a=rs.actual[m-1], p=rs.plan[m-1];
    const d=(a!=null&&p!=null)? a-p : null;
    kpi.push(a==null
      ? {l:"공사원가율(인건비)", v:"미입력", u:"", s:"실적 미입력", c:""}
      : {l:"공사원가율(인건비)", v:pct1(a), u:"",
         s:p!=null?"계획 대비 "+pp1(d):"계획 없음", c:signCls(d,true)});
  }
  {
    /* 판관비율(인건비) = 월별 실적 판관비 / 월별 실적 인건비 — +가 부정 */
    const a=ratio(rSga.mActual, rCost.mActual);          // sga/(sga+cost)
    const p=ratio(rSga.mPlan, rCost.mPlan);
    const d=(a!=null&&p!=null)? a-p : null;
    kpi.push(a==null
      ? {l:"판관비율(인건비)", v:"미입력", u:"", s:"실적 미입력", c:""}
      : {l:"판관비율(인건비)", v:pct1(a), u:"",
         s:p!=null?"계획 대비 "+pp1(d):"계획 없음", c:signCls(d,false)});
  }
  {
    /* 관리비율 = 누계실적 경비 / 누계예산 경비 */
    const v=(rAdm.yActual!=null && rAdm.yPlan)? rAdm.yActual/rAdm.yPlan*100 : null;
    kpi.push(v==null
      ? {l:"관리비율", v:"미입력", u:"", s:"누계 실적 없음", c:""}
      : {l:"관리비율", v:pct1(v), u:"",
         s:"누계 기준 1~"+rAdm.basis+"월 · 경비 실적/예산", c:""});
  }
  for(const r of fs.rows){
    kpi.push(r.mActual==null
      ? {l:r.label, v:"미입력", u:"", s:"-", c:""}
      : {l:r.label, v:nf1(r.mActual), u:"백만원",
         s:r.mVar==null?"-":"계획대비 "+sgn1(r.mVar)+"백만원",
         c:varColorClass(r.item,r.mVar)});
  }
  const kpiCard=(k,extra="")=>`<div class="kpi ${extra}"><div class="l">${esc(k.l)}</div>
     <div class="v num">${esc(k.v)}${k.u?`<span class="u">${k.u}</span>`:""}</div>
     <div class="s ${k.c}">${esc(k.s)}</div></div>`;
  /* 비율 KPI와 해당 금액 KPI를 같은 열에 배치 */
  let html=`<div class="kpis kpis4">
    ${kpiCard(kpi[0],"kpi-span")}
    ${[[1,4],[2,5],[3,6]].map(([a,b])=>
      `<div class="kpi-col">${kpiCard(kpi[a])}${kpiCard(kpi[b])}</div>`).join("")}
  </div>`;

  if(fs.missing) html+=`<div class="banner">⚠ ${m}월 재무 실적 데이터가 아직 입력되지 않았습니다.</div>`;

  /* 팀별 WORKLOAD Section을 생성한 뒤 잘라내어 공사원가율 아래에 배치한다 */
  const _wlStart=html.length;
  html+=`<section class="panel"><div class="sec-h">
    <h2>팀별 WORKLOAD 구성 <span class="sub">${y}년 ${m}월 · 팀별 전체 MH 중 업무 유형별 투입 비율(%) · 막대 클릭 시 내역 표시</span></h2>
    <select class="hide-print" aria-label="정렬" onchange="App.setSort(this.value)">
      ${["기본순서","수행율 높은순","일반율 높은순","총 MH 높은순"].map(o=>`<option ${o===S.sort?"selected":""}>${o}</option>`).join("")}
    </select></div>`;
  /* 세로바에 표시할 Category: 일반 제외 */
  const chartCats=ttf.cats.filter(c=>c!=="일반");
  html+=`<div class="legend center big sp">`+chartCats.map(c=>
    `<span class="it"><span class="sw" style="background:${CAT_COLORS[c]}"></span>${c}</span>`).join("")+`</div>`;
  /* 막대 클릭 내역: 팀×Category → 활동구분별 % (FE Toggle 반영) */
  const detailFor=(name,cat)=>{
    if(!doc||!doc.teams) return null;
    const acts={}; let has=false, denom=0;
    const collect=t=>{ const d=(t.detail||{})[cat];
      const f=((t.detailFE||{})[cat])||{};
      if(d){ has=true;
        for(const [a,v] of Object.entries(d)){
          const adj=v-(!S.feInclude?(f[a]||0):0);
          if(adj>0.001) acts[a]=(acts[a]||0)+adj;
        } } };
    if(name===TOTAL_LABEL){ doc.teams.forEach(collect); denom=ttf.total; }
    else{ const t0=doc.teams.find(t=>t.name===name); if(t0) collect(t0);
      const tr=ttf.teams.find(t=>t.name===name); denom=tr?tr.total:0; }
    if(!has||!denom) return null;
    return Object.entries(acts).map(([a,v])=>({a, pct:v/denom*100}))
      .sort((x,y)=>y.pct-x.pct);
  };
  const detailBox=(name,cat)=>{
    const items=detailFor(name,cat);
    let body;
    if(!items) body=`<div class="muted small">내역 데이터가 없습니다. 해당 월 Excel을 다시 Upload하면 표시됩니다.</div>`;
    else{
      const top=items.slice(0,5);
      const rest=items.slice(5);
      wlModalData={title:`${name} · ${cat} 전체 내역`, items,
        note:`${name===TOTAL_LABEL?"본부":"팀"} 전체 MH 대비 %`};
      body=`<div class="wl-detail-items num" style="grid-template-columns:1fr">`
        + top.map(x=>`<span class="wl-detail-it"><span title="${esc(x.a)}">${esc(x.a)}</span><b>${x.pct.toFixed(1)}%</b></span>`).join("")
        + (rest.length? `<span class="wl-detail-it etc" style="cursor:pointer" onclick="App.openDetailModal()"><span>그 외 ${rest.length}건 — 클릭하면 전체 내역</span><b>${rest.reduce((s,x)=>s+x.pct,0).toFixed(1)}%</b></span>`:"")
        + `</div>`;
    }
    return `<div class="wl-detail" style="margin-left:0">
      <div class="wl-detail-h"><span><b>${esc(name)}</b> · <span style="color:${CAT_COLORS[cat]}">■</span> ${esc(cat)} 내역 Top 5
      <span class="muted small">(${name===TOTAL_LABEL?"본부":"팀"} 전체 MH 대비 %)</span></span>
      <button class="btn sm" onclick="App.wlDetail(null,null)">닫기 ✕</button></div>${body}</div>`;
  };
  /* 가로 Stacked Bar: '전체'(모든 팀) + 분석 팀 (일반 제외, 합계 % 우측 표기) */
  const analysisTeams=ttf.teams.filter(t=>!ANALYSIS_EXCLUDE.includes(t.name));
  const cols=[];
  if(ttf.total>0)
    cols.push({name:TOTAL_LABEL, total:ttf.total, isTotal:true,
      pctOf:c=>ttf.division[c]?ttf.division[c].pct:0,
      mhOf:c=>ttf.division[c]?ttf.division[c].mh:0});
  for(const t of analysisTeams)
    cols.push({name:t.name, total:t.total, isTotal:false,
      pctOf:c=>t.pct[c]||0, mhOf:c=>t.catMH[c]||0});
  for(const col of cols){
    const shown=chartCats.filter(c=>col.pctOf(c)>0);
    const sum=shown.reduce((s,c)=>s+col.pctOf(c),0);
    let segs="";
    for(const c of shown){
      const p=col.pctOf(c);
      const sel=S.wlDetail && S.wlDetail.team===col.name && S.wlDetail.cat===c;
      const lbl=p>=LABEL_MIN? p.toFixed(1)+"%":"";
      segs+=`<div class="wl-seg${sel?" sel":""}" data-team="${esc(col.name)}" data-cat="${c}"
        style="flex:0 0 ${p}%;background:${CAT_COLORS[c]}"
        data-tip="<b>${esc(col.name)}</b><br><br>${c}<br>${p.toFixed(1)}%<br>${nf0(col.mhOf(c))} MH<br><br>클릭하면 내역이 표시됩니다"><span>${lbl}</span></div>`;
    }
    html+=`<div class="wl-row${col.isTotal?" total":""}">
      <div class="wl-team" title="${esc(col.name)}">${esc(col.name)}</div>
      <div class="wl-bar">${segs}</div>
      <div class="wl-sum num">${sum.toFixed(1)}%</div></div>`;
  }
  html+=`<div class="axis-x"><span></span><div class="ticks"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100%</span></div><span></span></div>`;
  if(S.wlDetail) html+=detailBox(S.wlDetail.team, S.wlDetail.cat);
  html+=`<div class="fin-note">${TOTAL_LABEL} = 모든 팀 합계 · ${ANALYSIS_EXCLUDE.join(", ")}은 팀별 분석에서 제외(${TOTAL_LABEL}에는 포함) · 일반 업무는 그래프에서 제외 (상세 데이터에는 포함)</div>`;
  if(ttf.cats.includes(UNKNOWN))
    html+=`<div class="fin-note">⚠ 정의되지 않은 업무구분이 '미분류'로 표시되어 있습니다. 관리자 확인이 필요합니다.</div>`;
  html+=`</section>`;

  /* 팀별 WORKLOAD Section 잘라내기 */
  const wlSection=html.slice(_wlStart);
  html=html.slice(0,_wlStart);

  /* Row 1: 인건비/관리비 — Full Width */
  html+=`<section class="panel"><div class="sec-h"><h2>인건비 / 관리비 <span class="sub">${y}년 ${m}월</span></h2>
    <button class="btn sm hide-print" onclick="App.openFinModal()">월별 확인</button></div>`;
  html+=finTableHTML(fs)+`</section>`;

  /* Row 2: 공사원가율(인건비) — Full Width, 1~12월 */
  html+=`<div class="section-gap"></div>`;
  html+=`<section class="panel"><div class="sec-h"><h2>공사원가율(인건비) <span class="sub"><b style="color:var(--ink)">${y}년</b> 1~12월 · 계획 vs 실적</span></h2></div>`;
  html+=`<div class="legend center sp lg2"><span class="it"><span class="sw" style="background:var(--v-red)"></span>계획</span>
    <span class="it"><span class="sw" style="background:${CAT_COLORS["수행"]}"></span>실적</span></div>`;
  /* Data Label: 계획 위 / 실적 아래, 실적>계획이면 반대 */
  const ptLabels=[];
  for(let i=0;i<12;i++){
    const p=rs.plan[i], a=rs.actual[i];
    const actualHigher=(p!=null && a!=null && a>p);
    if(p!=null) ptLabels.push({i, v:p, pos:actualHigher?"below":"above",
      color:"var(--v-red)", text:p.toFixed(1)+"%"});
    if(a!=null) ptLabels.push({i, v:a, pos:actualHigher?"above":"below",
      color:CAT_COLORS["수행"], text:a.toFixed(1)+"%"});
  }
  html+=svgLine({series:[
      {name:"계획", color:"var(--v-red)", dash:true, markers:false, faint:true,
       width:3.3, values:rs.plan},
      {name:"실적", color:CAT_COLORS["수행"], width:3.7, values:rs.actual}],
    labels:Array.from({length:12},(_,i)=>(i+1)+"월"), ySuffix:"%", w:1360, h:370,
    hl:m, pointLabels:ptLabels, labelSize:18, bigAxis:true, yDomain:[40,80],
    extra:i=>{ const p=rs.plan[i],a=rs.actual[i];
      return (p!=null&&a!=null)?`계획대비 ${pp1(a-p)}`:""; }});
  html+=`</section>`;

  /* Row 3: 팀별 WORKLOAD 구성 (공사원가율 아래, Full Width) */
  html+=`<div class="section-gap"></div>`+wlSection;

  /* 수행 프로젝트별 LOAD율 (생성 후 Trend 아래로 이동) */
  const _pjStart=html.length;
  html+=`<div class="section-gap"></div><section class="panel"><div class="sec-h">
    <h2>${y}년 ${m}월 수행 Project Workload율 <span class="sub">활동 구분별 MH ÷ 전체 입력 MH</span></h2>
    <div class="chips hide-print">${["수행+지원","수행","지원"].map(o=>
      `<button class="chip ${S.projMode===o?"on":""}" onclick="App.projMode('${o}')">${o}</button>`).join("")}</div></div>`;
  const projs=(doc&&doc.projects)||null;
  if(!projs || !projs.length){
    html+=`<div class="muted small">프로젝트 데이터가 없습니다. 해당 월 Excel을 다시 Upload하면 표시됩니다.</div>`;
  }else{
    const totalAll=tt.total || doc.totalMH || 0;
    /* FE Toggle 반영한 프로젝트 MH */
    const pmh=(p,c)=> Math.max(0,(p.mh[c]||0) - (!S.feInclude?((p.fe&&p.fe[c])||0):0));
    const valOf=p=> S.projMode==="수행+지원" ? pmh(p,"수행")+pmh(p,"지원") : pmh(p,S.projMode);
    let rows=projs.map(p=>({...p, v:valOf(p)})).filter(p=>p.v>0)
      .sort((a,b)=>b.v-a.v);
    let restRows=[];
    if(rows.length>PROJ_MAX_ROWS+1){
      restRows=rows.slice(PROJ_MAX_ROWS);
      rows=rows.slice(0,PROJ_MAX_ROWS);
      rows.push({name:`그 외 ${restRows.length}건`, etc:true,
        v:restRows.reduce((s,p)=>s+p.v,0)});
      projModalData={title:`수행 프로젝트 그 외 ${restRows.length}건`,
        items:restRows.map(p=>({a:p.name, pct:p.v/totalAll*100})),
        note:"LOAD율 = 프로젝트 MH ÷ 전체 입력 MH"};
    }else projModalData=null;
    const maxPct=Math.max(...rows.map(p=>p.v/totalAll*100), 0.001);
    if(S.projMode==="수행+지원")
      html+=`<div class="legend center sp lg2"><span class="it"><span class="sw" style="background:${CAT_COLORS["수행"]}"></span>수행</span>
        <span class="it"><span class="sw" style="background:${CAT_COLORS["지원"]}"></span>지원</span></div>`;
    for(const p of rows){
      const pctT=p.v/totalAll*100;
      const sel=S.projSel===p.name;
      const tip=p.etc
        ? `<b>${esc(p.name)}</b><br><br>클릭하면 전체 목록이 표시됩니다`
        : `<b>${esc(p.name)}</b><br><br>수행 ${(pmh(p,"수행")/totalAll*100).toFixed(1)}% · ${nf0(pmh(p,"수행"))} MH<br>지원 ${(pmh(p,"지원")/totalAll*100).toFixed(1)}% · ${nf0(pmh(p,"지원"))} MH<br><br>클릭하면 팀별 투입률이 표시됩니다`;
      let segs="";
      if(p.etc){
        segs=`<div class="pj-seg" style="width:${pctT/maxPct*100}%;background:var(--line)"></div>`;
      }else if(S.projMode==="수행+지원"){
        for(const c of PROJ_CATS){
          const w=pmh(p,c)/totalAll*100/maxPct*100;
          if(w>0) segs+=`<div class="pj-seg" style="width:${w}%;background:${CAT_COLORS[c]}"></div>`;
        }
      }else{
        segs=`<div class="pj-seg" style="width:${pctT/maxPct*100}%;background:${CAT_COLORS[S.projMode]}"></div>`;
      }
      html+=`<div class="pj-row${sel?" sel":""}" data-tip="${tip}" ${p.etc
          ? `onclick="App.openProjModal()"` : `data-proj="${esc(p.name)}"`}>
        <div class="pj-name" title="${esc(p.name)}" ${p.etc?'style="font-style:italic"':""}>${esc(p.name)}</div>
        <div class="pj-track">${segs}</div>
        <div class="pj-pct num">${pctT.toFixed(1)}%</div></div>`;
    }
    /* 프로젝트 클릭 → 팀별 투입률 세로바 (각 팀 전체 MH 100% 기준) */
    if(S.projSel){
      const p=projs.find(x=>x.name===S.projSel);
      if(p && p.teams && Object.keys(p.teams).length){
        const tmh=(t,c)=> Math.max(0,((p.teams[t]&&p.teams[t][c])||0)
          - (!S.feInclude?((p.teamsFE&&p.teamsFE[t]&&p.teamsFE[t][c])||0):0));
        const modeCats=S.projMode==="수행+지원"?PROJ_CATS:[S.projMode];
        /* 고정 정렬 순서 · 투입 0%도 표기 · 기술기획팀 제외 · 팀별 고유 색 */
        const bars=ttf.teams
          .filter(t=>!ANALYSIS_EXCLUDE.includes(t.name) && t.total>0)
          .map((t,i)=>{
            const mh=modeCats.reduce((s,c)=>s+tmh(t.name,c),0);
            return {name:t.name, mh, pct:mh/t.total*100, total:t.total,
              color:teamColor(t.name,i)};
          });
        const maxB=Math.max(...bars.map(b=>b.pct), 1);
        let bplot="", bnames="";
        for(const b of bars){
          const hp=b.pct/maxB*82;
          bplot+=`<div class="wlv-stack" data-tip="<b>${esc(b.name)}</b><br><br>${esc(p.name)}<br>${b.pct.toFixed(1)}% · ${nf0(b.mh)} MH<br>(팀 전체 ${nf0(b.total)} MH 대비)">
            <div class="wlv-sum num">${b.pct.toFixed(1)}%</div>
            <div class="wlv-seg" style="height:${hp}%;width:50%;margin:0 auto;background:${b.color}"></div></div>`;
          bnames+=`<div class="wlv-name" title="${esc(b.name)}">${esc(b.name)}</div>`;
        }
        const bg=`grid-template-columns:repeat(${bars.length},1fr)`;
        html+=`<div class="wl-detail" style="margin-left:0;margin-top:12px">
          <div class="wl-detail-h"><span><b>${esc(p.name)}</b> · 팀별 투입률
          <span class="muted small">(각 팀 전체 MH 100% 기준 · ${ANALYSIS_EXCLUDE.join(", ")} 제외)</span></span>
          <button class="btn sm" onclick="App.projSelect(null)">닫기 ✕</button></div>
          <div class="wlv-main">
            <div class="wlv-plot" style="${bg};gap:0;height:170px;background:none;border-bottom:1px solid var(--line)">${bplot}</div>
            <div class="wlv-names" style="${bg};gap:0">${bnames}</div>
          </div></div>`;
      }else{
        html+=`<div class="wl-detail" style="margin-left:0;margin-top:12px">
          <div class="wl-detail-h"><span><b>${esc(S.projSel)}</b> · 팀별 투입률</span>
          <button class="btn sm" onclick="App.projSelect(null)">닫기 ✕</button></div>
          <div class="muted small">팀별 데이터가 없습니다. 해당 월 Excel을 다시 Upload하면 표시됩니다.</div></div>`;
      }
    }
    html+=`<div class="fin-note">수행 프로젝트 = 업무구분 '수행'+'지원' · 분모 = 전체 입력 MH ${nf0(totalAll)} · Top ${PROJ_MAX_ROWS} 표시, 막대 클릭 시 팀별 투입률</div>`;
  }
  html+=`</section>`;
  const pjSection=html.slice(_pjStart);
  html=html.slice(0,_pjStart);

  /* trend */
  const yearMonths=periods().filter(p=>p.y===y);
  html+=`<div class="section-gap"></div><section class="panel"><div class="sec-h">
    <h2>월별 Workload 트렌드 <span class="sub">${y}년</span></h2></div>`;
  if(yearMonths.length>=2){
    /* 수행율(좌축) / 지원율·견적율(우축)을 하나의 그래프에.
       기본은 '전체', 팀 선택 시 해당 팀의 Trend (일반율 제외) */
    const allTeams=[...new Set(yearMonths.flatMap(p=>(S.months[p.key].teams||[]).map(t=>t.name)))]
      .filter(t=>!ANALYSIS_EXCLUDE.includes(t))
      .sort((a,b)=>teamRank(a)-teamRank(b));
    const options=[TOTAL_LABEL, ...allTeams];
    if(!options.includes(S.trendSel)) S.trendSel=TOTAL_LABEL;
    html+=`<div class="chips hide-print" style="margin-bottom:8px">${options.map(t=>
      `<button class="chip ${S.trendSel===t?"on":""}" onclick="App.trendSel('${esc(t)}')">${esc(t)}</button>`).join("")}</div>`;
    const labels=Array.from({length:12},(_,i)=>(i+1)+"월");
    const catVals=cat=>{
      const vals=Array(12).fill(null);
      yearMonths.forEach(p=>{ const tb=teamTable(S.months[p.key],"전체","기본순서");
        if(S.trendSel===TOTAL_LABEL)
          vals[p.m-1]=tb.division[cat]?tb.division[cat].pct:null;
        else{ const row=tb.teams.find(x=>x.name===S.trendSel);
          vals[p.m-1]=row? (row.pct[cat]||0) : null; } });
      return vals;
    };
    const series=[
      {name:"수행율", color:CAT_COLORS["수행"], width:3.7, values:catVals("수행")},
      {name:"지원율", color:CAT_COLORS["지원"], width:3.7, axis:"y2", values:catVals("지원")},
      {name:"견적율", color:CAT_COLORS["견적"], width:3.7, axis:"y2", values:catVals("견적")},
    ];
    /* Data Label (%· 소수점 1자리, 1% 미만 미표기) — 견적율은 아래쪽 배치 */
    const trL=[];
    series.forEach(s=>{
      s.values.forEach((v,i)=>{ if(v==null || v<1) return;
        trL.push({i, v, axis:s.axis, pos:s.name==="견적율"?"below":"above",
          color:s.color, text:v.toFixed(1)+"%"});
      });
    });
    html+=`<div class="legend center sp lg2">${series.map(s=>
      `<span class="it"><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`;
    html+=svgLine({series, labels, ySuffix:"%", w:1360, h:380, hl:m,
      pointLabels:trL, labelSize:18, bigAxis:true, yDomain:[0,100], y2Domain:[0,30]});
  }else{
    html+=`<div class="muted small">월별 Trend는 2개월 이상 데이터가 축적되면 표시됩니다.</div>`;
  }
  html+=`</section>`;

  /* Trend 아래: 수행 프로젝트별 LOAD율 */
  html+=pjSection;

  /* 수행 프로젝트별 누적 집계 (업무구분 '수행' · 조회월까지 등록된 월 합산) */
  {
    const cumMonths=periods().filter(p=>p.y===y && p.m<=m);
    const agg={};
    for(const p0 of cumMonths){
      const md=S.months[p0.key];
      for(const pr of (md.projects||[])){
        const v=Math.max(0,((pr.mh&&pr.mh.수행)||0)
          - (!S.feInclude?((pr.fe&&pr.fe.수행)||0):0));
        if(v>0) agg[pr.name]=(agg[pr.name]||0)+v;
      }
    }
    const list=Object.entries(agg).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
    const totalCum=list.reduce((s,x)=>s+x.v,0);
    const mFirst=cumMonths.length?cumMonths[0].m:m;
    const gapNote=cumMonths.length<(m-mFirst+1)
      ? ` · 미등록 월 제외, 등록된 ${cumMonths.length}개월 합산` : "";
    html+=`<div class="section-gap"></div><div class="grid" style="grid-template-columns:1fr 1fr">
      <section class="panel"><div class="sec-h">
      <h2>수행 프로젝트별 누적 집계</h2>
      <span class="sub"><b>누적 기간 : ${y}년 ${mFirst}월 ~ ${m}월</b>${gapNote} · 업무구분 '수행' MH${S.feInclude?"":" · FE 제외"}</span></div>`;
    if(!list.length){
      html+=`<div class="muted small">누적할 수행 데이터가 없습니다.</div>`;
    }else{
      const cumRow=x=>`<tr data-cumproj="${esc(x.n)}" style="cursor:pointer" title="클릭하면 월별 투입 내역이 표시됩니다"><td>${esc(x.n)}</td><td>${nf0(x.v)}</td><td>${(x.v/totalCum*100).toFixed(1)}%</td></tr>`;
      const TOPN=10;
      let shown=list, rest=[];
      if(list.length>TOPN+1){ rest=list.slice(TOPN); shown=list.slice(0,TOPN); }
      html+=`<div class="tbl-scroll"><table class="data num">
        <thead><tr><th>프로젝트(활동 구분)</th><th>누적 수행 MH (${mFirst}~${m}월)</th><th>구성비</th></tr></thead><tbody>`;
      for(const x of shown) html+=cumRow(x);
      if(rest.length){
        if(!S.cumExpand){
          const restSum=rest.reduce((s,x)=>s+x.v,0);
          html+=`<tr style="cursor:pointer" onclick="App.cumToggle()" title="클릭하면 나머지 프로젝트가 펼쳐집니다">
            <td style="font-style:italic;color:var(--ink3)">그 외 ${rest.length}건 — 클릭하여 펼치기 ▾</td>
            <td>${nf0(restSum)}</td><td>${(restSum/totalCum*100).toFixed(1)}%</td></tr>`;
        }else{
          for(const x of rest) html+=cumRow(x);
          html+=`<tr style="cursor:pointer" onclick="App.cumToggle()">
            <td colspan="3" style="text-align:center;font-style:italic;color:var(--ink3)">▴ 접기</td></tr>`;
        }
      }
      html+=`<tr style="font-weight:700"><td>합계</td><td>${nf0(totalCum)}</td><td>100.0%</td></tr>`;
      html+=`</tbody></table></div>
        <div class="fin-note">Top ${TOPN} 표시 · 행 클릭 시 월별 투입 MH·LOAD율 팝업이 표시됩니다.</div>`;
    }
    html+=`</section>`;
    /* 우측: Management Insight */
    html+=`<section class="panel"><div class="sec-h"><h2>Management Insight</h2></div><div class="insights">`;
    for(const [sev,text] of insights(y,m)){
      const ic=sev==="c"?["▲","var(--warn)"]:sev==="i"?["■","var(--ink3)"]:["●","var(--accent)"];
      html+=`<div class="insight"><span class="ic" style="color:${ic[1]}">${ic[0]}</span><span>${esc(text)}</span></div>`;
    }
    html+=`</div></section></div>`;
  }

  /* drilldown */
  const dt=teamTable(doc, "전체", S.sort);
  html+=`<details class="drill hide-exec"><summary>▸ 상세 데이터 보기</summary><div class="panel" style="margin-top:8px">
    <div class="sec-h"><h2>팀별 상세 WORKLOAD</h2></div>
    <div class="tbl-scroll"><table class="data num"><thead><tr><th>팀</th><th>총 MH</th>${dt.cats.map(c=>`<th>${c} MH</th><th>${c} %</th>`).join("")}</tr></thead><tbody>`;
  if(dt.total>0)
    html+=`<tr style="font-weight:700"><td>${TOTAL_LABEL}</td><td>${nf0(dt.total)}</td>${dt.cats.map(c=>
      `<td>${nf0(dt.division[c]?dt.division[c].mh:0)}</td><td>${(dt.division[c]?dt.division[c].pct:0).toFixed(1)}%</td>`).join("")}</tr>`;
  for(const t of dt.teams){
    const excl=ANALYSIS_EXCLUDE.includes(t.name);
    html+=`<tr><td>${esc(t.name)}${excl?' <span class="muted">(분석 제외)</span>':""}</td><td>${nf0(t.total)}</td>${dt.cats.map(c=>
      `<td>${nf0(t.catMH[c]||0)}</td><td>${t.pct[c].toFixed(1)}%</td>`).join("")}</tr>`;
  }
  html+=`</tbody></table></div>`;
  /* 프로젝트 상세 */
  if(projs && projs.length){
    const totalAll=tt.total || doc.totalMH || 0;
    const adj=(p,c)=>Math.max(0,(p.mh[c]||0)-(!S.feInclude?((p.fe&&p.fe[c])||0):0));
    html+=`<div class="sec-h" style="margin-top:16px"><h2>수행 프로젝트 상세 <span class="sub">분모 = 전체 입력 MH ${nf0(totalAll)}${S.feInclude?"":" · FE 제외"}</span></h2></div>
      <div class="tbl-scroll"><table class="data num"><thead><tr><th>프로젝트(활동 구분)</th><th>수행 MH</th><th>수행 %</th><th>지원 MH</th><th>지원 %</th><th>합계 MH</th><th>LOAD율</th></tr></thead><tbody>`;
    for(const p of projs){
      const su=adj(p,"수행"), ji=adj(p,"지원");
      const sum=su+ji;
      if(sum<=0) continue;
      html+=`<tr><td>${esc(p.name)}</td><td>${nf0(su)}</td><td>${(su/totalAll*100).toFixed(1)}%</td>
        <td>${nf0(ji)}</td><td>${(ji/totalAll*100).toFixed(1)}%</td>
        <td>${nf0(sum)}</td><td>${(sum/totalAll*100).toFixed(1)}%</td></tr>`;
    }
    html+=`</tbody></table></div>`;
  }
  html+=`
    <div class="sec-h" style="margin-top:16px"><h2>재무 상세 <span class="sub">단위 : 백만원</span></h2></div>
    <div class="tbl-scroll"><table class="data num"><thead><tr><th>구분</th><th>계획</th><th>실적</th><th>계획대비 증감</th><th>누계계획</th><th>누계실적</th><th>누계 계획대비 증감</th><th>누계기준</th></tr></thead><tbody>`;
  for(const r of fs.rows){
    html+=`<tr><td>${esc(r.label)}</td><td>${nf1(r.mPlan)}</td><td>${nf1(r.mActual)}</td><td>${sgn1(r.mVar)}</td>
      <td>${nf1(r.yPlan)}</td><td>${nf1(r.yActual)}</td><td>${sgn1(r.yVar)}</td><td>${r.basis? "1~"+r.basis+"월":"-"}</td></tr>`;
  }
  html+=`</tbody></table></div>
    <div style="display:flex;gap:10px;margin-top:14px" class="hide-print">
    ${S.canDownload?`<button class="btn" onclick="App.exportExcel()">📥 Excel Download</button>`:""}
    <button class="btn" onclick="window.print()">🖨 경영진 보고 출력</button></div>
  </div></details>`;

  v.innerHTML=html;
  /* workload segment / project row tooltips + 내역 click */
  v.querySelectorAll(".wl-seg, .pj-row, .wlv-stack[data-tip]").forEach(seg=>{
    seg.addEventListener("mousemove", ev=>{
      const tip=$("#tip"); tip.innerHTML=seg.dataset.tip; tip.style.display="block";
      tip.style.left=Math.min(ev.clientX+14, innerWidth-tip.offsetWidth-8)+"px";
      tip.style.top=(ev.clientY+14)+"px";
    });
    seg.addEventListener("mouseleave", ()=>$("#tip").style.display="none");
    if(seg.dataset.team)
      seg.addEventListener("click", ()=>{ $("#tip").style.display="none";
        App.wlDetail(seg.dataset.team, seg.dataset.cat); });
    if(seg.dataset.proj)
      seg.addEventListener("click", ()=>{ $("#tip").style.display="none";
        App.projSelect(seg.dataset.proj); });
  });
  v.querySelectorAll("[data-cumproj]").forEach(row=>
    row.addEventListener("click", ()=>App.openCumModal(row.dataset.cumproj)));
}
function finTableHTML(fs){
  const m=fs.month;
  let h=`<div class="tbl-scroll"><table class="fin num"><thead>
    <tr><th rowspan="2">구분</th><th colspan="3" class="gl">${m}월</th><th colspan="3" class="gl">누계</th></tr>
    <tr><th class="gl">계획</th><th>실적</th><th>계획대비 증감</th><th class="gl">계획</th><th>실적</th><th>계획대비 증감</th></tr></thead><tbody>`;
  const UNIT='<span class="u2">백만원</span>';
  const cell=(v,ov,orig)=> v==null
    ? `<td class="miss">미입력</td>`
    : `<td${ov?` title="관리자 수정값 (원본: ${orig==null?"미입력":nf1(orig)})"`:""}>${nf1(v)}${UNIT}${ov?'<span class="ovmark">*</span>':""}</td>`;
  const varCell=(item,v)=>`<td class="var" style="color:${varColorVar(item,v)}" title="실적 - 계획 (Actual - Plan)">${sgn1(v)}${v==null?"":UNIT}</td>`;
  for(const r of fs.rows){
    h+=`<tr><td class="cat">${esc(r.label)}</td>${cell(r.mPlan,r.ovP,r.origP)}${cell(r.mActual,r.ovA,r.origA)}${varCell(r.item,r.mVar)}
        ${cell(r.yPlan)}${cell(r.yActual)}${varCell(r.item,r.yVar)}</tr>`;
  }
  const anyOv=fs.rows.some(r=>r.ovA||r.ovP);
  h+=`</tbody></table></div><div class="fin-note">${esc(fs.basisNote)}${anyOv?' · <span class="ovmark">*</span> 관리자 수정값':""}</div>`;
  return h;
}

/* ---------- Monthly History ---------- */
function renderHistory(v){
  const ps=periods();
  if(!ps.length){ v.innerHTML=`<div class="empty"><b>등록된 월간 데이터가 없습니다.</b>Data Management에서 Excel 파일을 추가하십시오.</div>`; return; }
  if(!S.histFrom || !ps.find(p=>p.key===S.histFrom)) S.histFrom=ps[0].key;
  if(!S.histTo || !ps.find(p=>p.key===S.histTo)) S.histTo=ps[ps.length-1].key;
  let i0=ps.findIndex(p=>p.key===S.histFrom), i1=ps.findIndex(p=>p.key===S.histTo);
  if(i0>i1) [i0,i1]=[i1,i0];
  const sel=ps.slice(i0,i1+1);
  const labels=sel.map(p=>plabel(p.y,p.m).slice(2));
  const tables=sel.map(p=>teamTable(S.months[p.key],"전체","기본순서"));
  const rsCache={}; const finCache={};
  const rsOf=y=>rsCache[y]??=ratioSeries(y);
  const finOf=y=>{ if(!finCache[y]){ const f=getFin(y); finCache[y]=applyOv(f.plan,f.actual,activeOv(y)); } return finCache[y]; };

  let html=`<div class="sec-h" style="margin:14px 0 4px"><h2 style="font-size:18px">Monthly History</h2>
    <div class="chips hide-print"><label class="small muted">조회기간
      <select onchange="App.histFrom(this.value)">${ps.map(p=>`<option value="${p.key}" ${p.key===S.histFrom?"selected":""}>${plabel(p.y,p.m)}</option>`).join("")}</select> ~
      <select onchange="App.histTo(this.value)">${ps.map(p=>`<option value="${p.key}" ${p.key===S.histTo?"selected":""}>${plabel(p.y,p.m)}</option>`).join("")}</select></label></div></div>`;

  html+=`<div class="grid" style="grid-template-columns:1fr 1fr">`;
  html+=`<section class="panel"><div class="sec-h"><h2>총 MH</h2></div>`+
    svgBars({values:sel.map((p,i)=>tables[i].total||null), labels, name:"총 MH", color:CAT_COLORS["수행"], h:230})+`</section>`;
  html+=`<section class="panel"><div class="sec-h"><h2>WORKLOAD율 추이</h2></div>
    <div class="legend">${CATS.map(c=>`<span class="it"><span class="sw" style="background:${CAT_COLORS[c]}"></span>${c}율</span>`).join("")}</div>`+
    svgLine({series:CATS.map(c=>({name:c+"율", color:CAT_COLORS[c],
      values:sel.map((p,i)=>tables[i].division[c]?tables[i].division[c].pct:null)})),
      labels, ySuffix:"%", h:230})+`</section>`;
  html+=`<section class="panel"><div class="sec-h"><h2>공사원가율(인건비) <span class="sub">계획 vs 실적</span></h2></div>`+
    svgLine({series:[
      {name:"계획", color:"var(--v-red)", dash:true, markers:false, faint:true,
       values:sel.map(p=>rsOf(p.y).plan[p.m-1])},
      {name:"실적", color:CAT_COLORS["수행"], values:sel.map(p=>rsOf(p.y).actual[p.m-1])}],
      labels, ySuffix:"%", h:230})+`</section>`;
  html+=`<section class="panel"><div class="sec-h"><h2>재무 계획대비 증감 <span class="sub">실적 - 계획 · 백만원</span></h2></div>
    <div class="legend">${ITEMS.map(([k,l],i)=>`<span class="it"><span class="sw" style="background:${TEAM_PALETTE[i]}"></span>${l}</span>`).join("")}</div>`+
    svgLine({series:ITEMS.map(([k,l],i)=>({name:l, color:TEAM_PALETTE[i],
      values:sel.map(p=>{ const f=finOf(p.y); const a=f.actual[k][p.m-1], pl=f.plan[k][p.m-1];
        return (a!=null&&pl!=null)? a-pl : null; })})),
      labels, ySuffix:"", h:230, fmt:v=>sgn1(v)+"백만원"})+`</section>`;
  html+=`</div>`;

  /* 항목별 계획 vs 실적 */
  html+=`<div class="section-gap"></div><div class="grid" style="grid-template-columns:1fr 1fr 1fr">`;
  for(const [k,l] of ITEMS){
    html+=`<section class="panel"><div class="sec-h"><h2>${l} <span class="sub">백만원</span></h2></div>`+
      svgLine({series:[
        {name:"계획", color:"var(--ink3)", dash:true, values:sel.map(p=>finOf(p.y).plan[k][p.m-1])},
        {name:"실적", color:CAT_COLORS["수행"], values:sel.map(p=>finOf(p.y).actual[k][p.m-1])}],
        labels, ySuffix:"", h:200, fmt:v=>nf1(v)+"백만원"})+`</section>`;
  }
  html+=`</div>`;

  /* month comparison */
  if(ps.length>=2){
    if(!S.histA || !ps.find(p=>p.key===S.histA)) S.histA=ps[ps.length-2].key;
    if(!S.histB || !ps.find(p=>p.key===S.histB)) S.histB=ps[ps.length-1].key;
    const A=ps.find(p=>p.key===S.histA), B=ps.find(p=>p.key===S.histB);
    const ta=teamTable(S.months[A.key],"전체","기본순서"), tb=teamTable(S.months[B.key],"전체","기본순서");
    const fa=finSummary(A.y,A.m), fb=finSummary(B.y,B.m);
    const ra=rsOf(A.y).actual[A.m-1], rb=rsOf(B.y).actual[B.m-1];
    const rows=[];
    rows.push(["총 MH", nf0(ta.total), nf0(tb.total),
      (ta.total&&tb.total)?(tb.total-ta.total>=0?"+":"")+nf0(tb.total-ta.total):"-"]);
    for(const c of CATS){
      const a=ta.division[c]?ta.division[c].pct:null, b=tb.division[c]?tb.division[c].pct:null;
      rows.push([c+"율", pct1(a), pct1(b), (a!=null&&b!=null)?pp1(b-a):"-"]);
    }
    rows.push(["공사원가율(실적)", pct1(ra), pct1(rb), (ra!=null&&rb!=null)?pp1(rb-ra):"-"]);
    fa.rows.forEach((r,i)=>{
      const b=fb.rows[i];
      rows.push([r.label+" 실적", nf1(r.mActual), nf1(b.mActual),
        (r.mActual!=null&&b.mActual!=null)? sgn1(b.mActual-r.mActual):"-"]);
    });
    html+=`<div class="section-gap"></div><section class="panel">
      <div class="sec-h"><h2>Month Comparison <span class="sub">두 개월 직접 비교</span></h2>
      <div class="chips hide-print"><label class="small muted">기준월 A
        <select onchange="App.histA(this.value)">${ps.map(p=>`<option value="${p.key}" ${p.key===S.histA?"selected":""}>${plabel(p.y,p.m)}</option>`).join("")}</select></label>
      <label class="small muted">기준월 B
        <select onchange="App.histB(this.value)">${ps.map(p=>`<option value="${p.key}" ${p.key===S.histB?"selected":""}>${plabel(p.y,p.m)}</option>`).join("")}</select></label></div></div>
      <div class="tbl-scroll"><table class="data num"><thead><tr><th>항목</th><th>${plabel(A.y,A.m)}</th><th>${plabel(B.y,B.m)}</th><th>증감</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div></section>`;
  }
  v.innerHTML=html;
}

/* ---------- Data Management ---------- */
function renderData(v){
  let html=`<div class="sec-h" style="margin:14px 0 10px"><h2 style="font-size:18px">Data Management</h2>
    <span class="sub">월간 Excel 데이터 추가 · 원본 파일은 수정되지 않습니다</span></div>`;

    html+=`<div class="banner" style="background:var(--accent-soft); border-color:var(--line); color:var(--ink2)">
      <b>GitHub 게시 갱신</b> · Excel 반영 후 아래 버튼으로 data.json을 저장하고,
      GitHub 저장소의 data.json을 교체(Commit)하면 링크를 가진 모든 사람의 화면에 반영됩니다.
      <div style="margin-top:8px"><button class="btn sm" onclick="App.downloadDataJson()">📄 GitHub 게시용 data.json 저장</button></div></div>`;

    html+=`<div class="banner">이 화면은 게시본(조회 전용)입니다. 데이터 추가/수정은 원본 Dashboard에서 하고, 갱신된 data.json을 GitHub에 다시 업로드하십시오.</div>`;
    v.innerHTML=html; return;
  }
  html+=`<section class="panel">
    <div class="drop" id="drop" onclick="document.getElementById('fileIn').click()">
      <b>Excel 파일을 여기에 끌어다 놓거나 클릭하여 선택</b><br>
      <span class="small">.xlsx / .xlsm · 원데이터 Sheet + 'YYYY년 예산_순수본부 판관비' Sheet</span>
    </div>
    <input type="file" id="fileIn" accept=".xlsx,.xlsm" style="display:none" onchange="App.file(this.files[0])">`;

  if(p){
    if(p.error){
      html+=`<div class="banner" style="margin-top:14px">Excel 파일 구조를 확인할 수 없습니다.<br>${esc(p.error)}</div>`;
    }else{
      const q=buildQuality(p, p.year, p.month);
      const status=q.some(x=>x.status==="err")?"오류":q.some(x=>x.status==="warn")?"확인 필요":"정상";
      html+=`<div class="grid" style="margin-top:16px"><div>
        <h3 style="margin:0 0 8px;font-size:14px">Upload Preview</h3>
        <dl class="kv">
          <dt>파일명</dt><dd class="mono">${esc(p.filename)}</dd>
          <dt>파일크기</dt><dd>${nf0(p.size/1024)} KB</dd>
          <dt>총 Rows</dt><dd>${nf0(p.raw.recordCount)}</dd>
          <dt>총 MH</dt><dd>${nf0(p.raw.totalMH)}</dd>
          <dt>기준시간</dt><dd>${p.raw.baseHours ?? "-"}</dd>
          <dt>Teams</dt><dd>${p.raw.teams.length}개</dd>
        </dl>
        <div style="display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap">
          <label class="small muted">대상 Year
            <select onchange="App.pendYear(+this.value)">${Array.from({length:21},(_,i)=>2020+i).map(yy=>
              `<option ${yy===p.year?"selected":""}>${yy}</option>`).join("")}</select></label>
          <label class="small muted">대상 Month
            <select onchange="App.pendMonth(+this.value)">${Array.from({length:12},(_,i)=>i+1).map(mm=>
              `<option value="${mm}" ${mm===p.month?"selected":""}>${mm}월</option>`).join("")}</select></label>
        </div>
        ${!p.yearFromDates? `<div class="small" style="color:var(--warn);margin-top:6px">⚠ 작업일자에 연도가 없어 자동 추정한 연도입니다. 반드시 확인하십시오.</div>`:""}
        ${p.finSheets.length>1? `<div style="margin-top:10px"><label class="small muted">재무 데이터 Sheet (기준 연도 선택)
          <select onchange="App.pendFin(this.value)">${p.finSheets.map(n=>
            `<option ${n===p.finChoice?"selected":""}>${esc(n)}</option>`).join("")}</select></label></div>`:""}
      </div><div>
        <h3 style="margin:0 0 8px;font-size:14px">Data Quality : ${status}</h3>
        <div class="qlist">${q.map(x=>`<span class="q-${x.status==="ok"?"ok":x.status==="warn"?"warn":"err"}">${x.status==="ok"?"✓":x.status==="warn"?"⚠":"✕"} <b>${esc(x.name)}</b> — ${esc(x.detail)}</span>`).join("")}</div>
      </div></div>`;
      /* duplicates */
      const dupFile=S.files[p.hash];
      const dupMonth=!!S.months[mkey(p.year,p.month)];
      if(dupFile) html+=`<div class="banner" style="margin-top:12px">동일한 파일이 이미 Upload된 이력이 있습니다 (${esc(dupFile.filename)}, ${esc(dupFile.uploadedAt)}).</div>`;
      if(dupMonth){
        html+=`<div class="banner" style="margin-top:12px">${p.year}년 ${p.month}월 데이터가 이미 존재합니다.</div>
        <div class="chips" style="margin-top:8px">${["기존 데이터 유지","신규 데이터로 교체","Upload 취소"].map(o=>
          `<button class="chip ${p.dupChoice===o?"on":""}" onclick="App.dupChoice('${o}')">${o}</button>`).join("")}</div>`;
      }
      const canCommit = status!=="오류" && (!dupMonth || p.dupChoice==="신규 데이터로 교체");
      if(dupMonth && p.dupChoice==="기존 데이터 유지") html+=`<div class="small muted" style="margin-top:8px">기존 데이터를 유지합니다. 저장소는 변경되지 않았습니다.</div>`;
      if(dupMonth && p.dupChoice==="Upload 취소") html+=`<div class="small muted" style="margin-top:8px">Upload를 취소했습니다.</div>`;
      html+=`<div style="margin-top:16px"><button class="btn pri" ${canCommit?"":"disabled"} onclick="App.commit()">💾 저장소에 반영</button></div>`;
    }
  }
  html+=`</section>`;

  /* 현황 */
  const ps=periods();
  html+=`<div class="section-gap"></div><div class="grid" style="grid-template-columns:1fr 2fr">
    <section class="panel"><div class="sec-h"><h2>등록된 월</h2></div>
    ${ps.length? ps.map(p=>{
        const confirming=S.delConfirm===p.key;
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2)">
          <span>${p.y}년 ${p.m}월 <span class="muted small">(${nf0(S.months[p.key].totalMH)} MH)</span></span>
          ${confirming
            ? `<span style="display:flex;gap:6px;align-items:center"><span class="small" style="color:var(--v-red)">삭제하시겠습니까?</span>
               <button class="btn sm" style="color:var(--v-red);border-color:var(--v-red)" onclick="App.deleteMonth(${p.y},${p.m})">삭제 확정</button>
               <button class="btn sm" onclick="App.delConfirm(null)">취소</button></span>`
            : `<button class="btn sm" onclick="App.delConfirm('${p.key}')">삭제</button>`}
        </div>${confirming?`<div class="small" style="color:var(--warn);padding:4px 0">WORKLOAD·프로젝트 데이터와 Upload 이력이 삭제됩니다. 재무 연간 데이터는 유지됩니다.</div>`:""}`;
      }).join("")
      : `<div class="muted small">등록된 데이터가 없습니다.</div>`}</section>
    <section class="panel"><div class="sec-h"><h2>Upload 이력</h2></div>`;
  const files=Object.values(S.files).sort((a,b)=>(b.uploadedAt||"").localeCompare(a.uploadedAt||""));
  if(files.length){
    html+=`<div class="tbl-scroll"><table class="data num"><thead><tr><th>파일명</th><th>연도</th><th>월</th><th>Upload 일시</th><th>Rows</th><th>총 MH</th><th>기준시간</th><th>상태</th></tr></thead><tbody>`;
    for(const f of files) html+=`<tr><td>${esc(f.filename)}</td><td>${f.year}</td><td>${f.month}</td><td>${esc(f.uploadedAt)}</td><td>${nf0(f.rowCount)}</td><td>${nf0(f.totalMH)}</td><td>${f.baseHours??"-"}</td><td>${esc(f.status)}</td></tr>`;
    html+=`</tbody></table></div>`;
  }else html+=`<div class="muted small">Upload 이력이 없습니다.</div>`;
  html+=`</section></div>`;
  v.innerHTML=html;
  const drop=$("#drop");
  if(drop){
    ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("on");}));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("on");}));
    drop.addEventListener("drop", e=>{ const f=e.dataTransfer.files[0]; if(f) App.file(f); });
  }
}

/* ---------- Admin ---------- */
function renderAdmin(v){
  const ps=periods();
  let html=`<div class="sec-h" style="margin:14px 0 10px"><h2 style="font-size:18px">Admin
    <span class="badge-admin">관리자</span></h2>
    <span class="sub">수정값은 원본과 분리 저장되며 모든 변경은 Audit Log로 보존됩니다</span></div>`;
  html+=`<div class="banner">데이터 변경은 이 Artifact의 <b>편집 권한</b>이 있는 계정만 저장할 수 있습니다 (조회 전용 계정은 읽기만 가능).</div>`;
  if(!ps.length){ v.innerHTML=html+`<div class="empty"><b>등록된 데이터가 없습니다.</b>Data Management에서 Excel을 먼저 추가하십시오.</div>`; return; }
  const years=[...new Set(ps.map(p=>p.y))];
  if(!S.admSel) S.admSel={y:S.sel?S.sel.y:years[years.length-1], m:S.sel?S.sel.m:1};
  const {y,m}=S.admSel;
  const {plan, actual}=getFin(y);
  const ovs=activeOv(y);
  html+=`<section class="panel"><div class="sec-h">
    <h2>관리자 데이터 수정 - 실적 <span class="sub">${y}년 ${m}월 · 단위 : 백만원</span></h2>
    <div class="chips">
      <select onchange="App.admYear(+this.value)">${years.map(yy=>`<option ${yy===y?"selected":""}>${yy}</option>`).join("")}</select>
      <select onchange="App.admMonth(+this.value)">${Array.from({length:12},(_,i)=>i+1).map(mm=>`<option value="${mm}" ${mm===m?"selected":""}>${mm}월</option>`).join("")}</select>
      <input type="text" style="width:110px" value="${esc(S.adminName)}" aria-label="수정자" onchange="App.admName(this.value)" placeholder="수정자">
    </div></div>`;
  const block=(field)=>{
    let h=`<div class="form-row muted small" style="border-bottom:1px solid var(--line)"><span>구분</span><span>원본</span><span>현재 적용값</span><span>수정값 입력</span></div>`;
    for(const [item,label] of ITEMS){
      const series=field==="actual"?actual:plan;
      const orig=series[item][m-1];
      const ov=ovs.find(o=>o.month===m&&o.item===item&&o.field===field);
      const eff=ov?ov.overrideValue:orig;
      h+=`<div class="form-row">
        <span class="lab">${label}</span>
        <span class="num">${orig==null?'<i class="muted">미입력</i>':nf1(orig)}</span>
        <span class="num">${eff==null?'<i class="muted">미입력</i>':nf1(eff)+(ov?' <span class="ovmark">(수정)</span>':"")}</span>
        <input type="text" inputmode="decimal" id="ov_${field}_${item}" placeholder="예: 1132.5"></div>`;
    }
    h+=`<div style="display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap">
      <input type="text" id="reason_${field}" style="flex:1;min-width:220px" placeholder="수정 사유 (필수) · 예: 월간 마감자료 반영">
      <button class="btn pri" onclick="App.saveOverrides('${field}')">저장</button></div>`;
    return h;
  };
  html+=block("actual")+`</section>`;
  html+=`<div class="section-gap"></div><section class="panel"><details><summary class="small muted" style="cursor:pointer">계획값 수정 (관리자 권한 확장 기능)</summary>
    <div style="margin-top:10px">`+block("plan")+`</div></details></section>`;

  /* active overrides */
  html+=`<div class="section-gap"></div><section class="panel"><div class="sec-h"><h2>활성 수정 내역 <span class="sub">${y}년</span></h2></div>`;
  if(ovs.length){
    for(const o of ovs.sort((a,b)=>a.month-b.month)){
      html+=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)">
        <span class="small"><b>${o.year}년 ${o.month}월 ${ITEM_LABEL[o.item]||o.item} (${o.field==="actual"?"실적":"계획"})</b>
        · 원본: ${o.originalValue==null?"미입력":nf1(o.originalValue)} → 수정: ${nf1(o.overrideValue)}
        · 사유: ${esc(o.reason)} · ${esc(o.modifiedBy)} (${esc(o.modifiedAt)})</span>
        <button class="btn sm" onclick="App.cancelOv('${esc(o.id)}')">수정 취소</button></div>`;
    }
  }else html+=`<div class="muted small">활성 수정 내역이 없습니다.</div>`;
  html+=`</section>`;

  /* audit log */
  const log=[...S.overrides].sort((a,b)=>(b.modifiedAt||"").localeCompare(a.modifiedAt||""));
  html+=`<div class="section-gap"></div><section class="panel"><div class="sec-h"><h2>Audit Log <span class="sub">모든 변경 기록 (삭제되지 않음)</span></h2></div>`;
  if(log.length){
    html+=`<div class="tbl-scroll"><table class="data num"><thead><tr><th>연도</th><th>월</th><th>항목</th><th>구분</th><th>원본값</th><th>변경값</th><th>수정사유</th><th>사용자</th><th>수정일시</th><th>상태</th></tr></thead><tbody>`;
    for(const o of log) html+=`<tr><td>${o.year}</td><td>${o.month}</td><td>${ITEM_LABEL[o.item]||esc(o.item)}</td>
      <td>${o.field==="actual"?"실적":"계획"}</td><td>${o.originalValue==null?"미입력":nf1(o.originalValue)}</td>
      <td>${nf1(o.overrideValue)}</td><td>${esc(o.reason)}</td><td>${esc(o.modifiedBy)}</td><td>${esc(o.modifiedAt)}</td>
      <td>${o.active?"활성":"비활성"}</td></tr>`;
    html+=`</tbody></table></div>`;
  }else html+=`<div class="muted small">수정 이력이 없습니다.</div>`;
  html+=`</section>`;
  v.innerHTML=html;
}

   Actions
===================================================================== */
window.App={
  tab(t){ S.tab=t; renderAll(); },
  selYear(y){ const ms=periods().filter(p=>p.y===y).map(p=>p.m);
    S.sel={y, m:ms.includes(S.sel.m)?S.sel.m:ms[ms.length-1]};
    S.wlDetail=null; S.projSel=null; S.trendSel=TOTAL_LABEL;
    S.cumExpand=false; renderAll(); },
  selMonth(m){ S.sel.m=m; S.wlDetail=null; S.projSel=null;
    S.trendSel=TOTAL_LABEL; S.cumExpand=false; renderAll(); },
  cumToggle(){ S.cumExpand=!S.cumExpand; renderAll(); },
  setSort(v){ S.sort=v; renderAll(); },
  wlDetail(team,cat){
    S.wlDetail=(team && !(S.wlDetail && S.wlDetail.team===team && S.wlDetail.cat===cat))
      ? {team, cat} : null;
    renderAll(); },
  trendSel(t){ S.trendSel=t; renderAll(); },
  projMode(m){ S.projMode=m; renderAll(); },
  projSelect(name){ S.projSel=(name && S.projSel!==name)? name : null; renderAll(); },
  _modalList(d){
    if(!d) return;
    const body=`<div class="wl-detail-items num" style="grid-template-columns:1fr">`
      + d.items.map(x=>`<span class="wl-detail-it"><span title="${esc(x.a)}">${esc(x.a)}</span><b>${x.pct.toFixed(1)}%</b></span>`).join("")
      + `</div><div class="fin-note">${esc(d.note)}</div>`;
    $("#modal-title").textContent=d.title;
    $("#modal-body").innerHTML=body;
    $("#modal").hidden=false;
  },
  openDetailModal(){ App._modalList(wlModalData); },
  openProjModal(){ App._modalList(projModalData); },
  closeModal(){ const md=$("#modal"); md.hidden=true; md.classList.remove("wide");
    S.cumSel=null; },
  /* 인건비/관리비 '월별 확인' 팝업: 월별 계획/실적/계획대비 증감 */
  openFinModal(){
    if(!S.sel) return;
    const y=S.sel.y;
    const fin=getFin(y);
    const {plan:P, actual:A}=applyOv(fin.plan, fin.actual, activeOv(y));
    const UNIT='<span class="u2">백만원</span>';
    let t=`<div class="tbl-scroll"><table class="fin num"><thead>
      <tr><th rowspan="2">월</th>${ITEMS.map(([k,l])=>`<th colspan="3" class="gl">${l}</th>`).join("")}</tr>
      <tr>${ITEMS.map(()=>`<th class="gl">계획</th><th>실적</th><th>계획대비 증감</th>`).join("")}</tr></thead><tbody>`;
    for(let mm=1; mm<=12; mm++){
      t+=`<tr><td class="cat">${mm}월</td>`;
      for(const [k] of ITEMS){
        const p=P[k][mm-1], a=A[k][mm-1];
        const v=(p!=null&&a!=null)? a-p : null;
        t+=`<td>${p==null?'<span class="miss" style="color:var(--ink3)">-</span>':nf1(p)+UNIT}</td>`;
        t+=a==null? `<td class="miss">미입력</td>` : `<td>${nf1(a)}${UNIT}</td>`;
        t+=`<td class="var" style="color:${varColorVar(k,v)}">${v==null?"-":sgn1(v)+"백만원"}</td>`;
      }
      t+=`</tr>`;
    }
    /* 누계 행 (항목별 1월부터 연속 입력 구간 동일기간 비교) */
    t+=`<tr style="font-weight:700; border-top:2px solid var(--line)"><td class="cat">누계</td>`;
    for(const [k] of ITEMS){
      const basis=ytdBasis(A[k],12);
      if(basis>0){
        const yp=P[k].slice(0,basis).reduce((s,v2)=>s+(v2||0),0);
        const ya=A[k].slice(0,basis).reduce((s,v2)=>s+(v2||0),0);
        t+=`<td title="1~${basis}월">${nf1(yp)}${UNIT}</td><td title="1~${basis}월">${nf1(ya)}${UNIT}</td>
          <td class="var" style="color:${varColorVar(k,ya-yp)}">${sgn1(ya-yp)}백만원</td>`;
      }else t+=`<td>-</td><td class="miss">미입력</td><td>-</td>`;
    }
    t+=`</tr></tbody></table></div>
      <div class="fin-note">계획대비 증감 = 실적 - 계획 · 누계는 항목별 실적 입력월까지 동일 기간 비교</div>`;
    const md=$("#modal"); md.classList.add("wide");
    $("#modal-title").textContent=y+"년 월별 계획 / 실적";
    $("#modal-body").innerHTML=t;
    md.hidden=false;
  },
  /* 누적 집계 행 클릭 → 월별 투입 내역 팝업 (전체/팀 전환, 팀 색상 적용) */
  openCumModal(name){ S.cumSel={proj:name, entity:TOTAL_LABEL}; App._renderCumModal(); },
  cumEntity(e){ if(!S.cumSel) return; S.cumSel.entity=e; App._renderCumModal(); },
  _renderCumModal(){
    if(!S.cumSel || !S.sel) return;
    const {proj, entity}=S.cumSel; const {y,m}=S.sel;
    const cumMonths=periods().filter(p=>p.y===y && p.m<=m);
    const teams=[...new Set(cumMonths.flatMap(p=>(S.months[p.key].teams||[]).map(t=>t.name)))]
      .filter(t=>!ANALYSIS_EXCLUDE.includes(t)).sort((a,b)=>teamRank(a)-teamRank(b));
    const entColor= entity===TOTAL_LABEL ? "var(--accent)" : (TEAM_COLORS[entity]||"var(--accent)");
    const rows=[]; let sumMH=0, sumDen=0;
    for(const p0 of cumMonths){
      const md=S.months[p0.key];
      const tt0=teamTable(md,"전체","기본순서");
      const pr=(md.projects||[]).find(x=>x.name===proj);
      let v=0, den=0;
      if(entity===TOTAL_LABEL){
        v= pr? Math.max(0,((pr.mh&&pr.mh.수행)||0)-(!S.feInclude?((pr.fe&&pr.fe.수행)||0):0)) : 0;
        den= tt0.total;
      }else{
        v= pr? Math.max(0,((pr.teams&&pr.teams[entity]&&pr.teams[entity].수행)||0)
             -(!S.feInclude?((pr.teamsFE&&pr.teamsFE[entity]&&pr.teamsFE[entity].수행)||0):0)) : 0;
        const tr=tt0.teams.find(t=>t.name===entity); den= tr? tr.total:0;
      }
      rows.push({m:p0.m, v, load: den? v/den*100 : null});
      sumMH+=v; sumDen+=den;
    }
    const cumLoad= sumDen? sumMH/sumDen*100 : null;
    const maxLoad=Math.max(...rows.map(r=>r.load||0), 0.001);
    const chips=`<div class="legend center sp lg2" style="margin:2px 0 12px;gap:14px">
      ${[TOTAL_LABEL,...teams].map(t=>{
        const c=t===TOTAL_LABEL?"var(--accent)":(TEAM_COLORS[t]||"#888");
        return `<button class="chip ${entity===t?"on":""}" onclick="App.cumEntity('${esc(t)}')"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c};margin-right:6px;vertical-align:-1px"></span>${esc(t)}</button>`;
      }).join("")}</div>`;
    let table=`<div class="tbl-scroll"><table class="data num"><thead>
      <tr><th>월</th><th>수행 MH</th><th>LOAD율</th><th style="width:36%"></th></tr></thead><tbody>`;
    for(const r of rows)
      table+=`<tr><td>${y}년 ${r.m}월</td><td>${nf0(r.v)}</td><td>${r.load==null?"-":r.load.toFixed(1)+"%"}</td>
        <td><div style="height:12px;border-radius:3px;background:${entColor};width:${r.load? Math.max(1,r.load/maxLoad*100):0}%"></div></td></tr>`;
    table+=`<tr style="font-weight:700"><td>누계 (${rows.length?rows[0].m:m}~${m}월)</td><td>${nf0(sumMH)}</td><td>${cumLoad==null?"-":cumLoad.toFixed(1)+"%"}</td><td></td></tr>`;
    table+=`</tbody></table></div>
      <div class="fin-note">LOAD율 = ${entity===TOTAL_LABEL?"본부 전체":esc(entity)}의 해당 프로젝트 수행 MH ÷ ${entity===TOTAL_LABEL?"본부":"팀"} 전체 MH${S.feInclude?"":" · FE 제외"}</div>`;
    $("#modal-title").textContent=proj+" · 월별 투입 내역";
    $("#modal-body").innerHTML=chips+table;
    $("#modal").hidden=false;
  },
  feToggle(){ S.feInclude=!S.feInclude; lsSet("emd-fe",S.feInclude);
    S.wlDetail=null; S.projSel=null; renderAll(); },
  execToggle(){ S.exec=!S.exec; lsSet("emd-exec",S.exec);
    try{ history.replaceState(null,"",S.exec?"#exec":location.pathname+location.search); }catch(e){}
    renderAll(); },
  histFrom(k){ S.histFrom=k; renderAll(); }, histTo(k){ S.histTo=k; renderAll(); },
  histA(k){ S.histA=k; renderAll(); }, histB(k){ S.histB=k; renderAll(); },
  admYear(y){ S.admSel={y, m:S.admSel.m}; renderAll(); },
  admMonth(m){ S.admSel.m=m; renderAll(); },
  admName(n){ S.adminName=n||"admin"; lsSet("emd-admin-name",S.adminName); },
  dupChoice(o){ if(S.pending) S.pending.dupChoice=o; renderAll(); },
  pendYear(y){ if(S.pending){ S.pending.year=y; S.pending.dupChoice=null; renderAll(); } },
  pendMonth(m){ if(S.pending){ S.pending.month=m; S.pending.dupChoice=null; renderAll(); } },
  pendFin(name){ const p=S.pending; if(!p) return;
    try{ p.fin=parseFinSheet(p.wb,name); p.finChoice=name; p.finError=null; }
    catch(e){ p.fin=null; p.finError=e.message; }
    renderAll(); },
  async file(f){
    if(!f) return;
    try{
      const buf=await f.arrayBuffer();
      const parsed=await parseWorkbook(buf, f.name);
      S.pending={...parsed, size:f.size, year:parsed.yearGuess ?? new Date().getFullYear(),
        month:parsed.monthGuess ?? 1, dupChoice:null, error:null};
    }catch(e){
      S.pending={filename:f.name, size:f.size, error:e.message||String(e)};
    }
    renderAll();
  },
  async commit(){
    const p=S.pending; if(!p||p.error) return;
    try{
      const q=buildQuality(p, p.year, p.month);
      const r2=v=>Math.round((v||0)*100)/100;
      const rActs=acts=>Object.fromEntries(Object.entries(acts||{}).map(([a,v])=>[a,r2(v)]));
      const rDet=d=>Object.fromEntries(Object.entries(d||{}).map(([c,acts])=>[c,rActs(acts)]));
      const rTwo=o=>({수행:r2(o&&o.수행), 지원:r2(o&&o.지원)});
      const rTeams=tm=>Object.fromEntries(Object.entries(tm||{}).map(([t,v])=>[t,rTwo(v)]));
      const doc={ year:p.year, month:p.month, baseHours:p.raw.baseHours,
        recordCount:p.raw.recordCount, totalMH:Math.round(p.raw.totalMH*10)/10,
        sourceFile:p.filename, uploadedAt:nowStr(),
        teams:p.raw.teams.map(t=>({name:t.name, order:t.order,
          st:Object.fromEntries(Object.entries(t.st).map(([s,c])=>[s,rActs(c)])),
          detail:rDet(t.detail), detailFE:rDet(t.detailFE)})),
        projects:(p.raw.projects||[]).map(pr=>({name:pr.name,
          mh:rTwo(pr.mh), fe:rTwo(pr.fe),
          teams:rTeams(pr.teams), teamsFE:rTeams(pr.teamsFE)})),
        quality:q, unknownTypes:p.raw.quality.unknownTypes };
      await Store.saveMonth(doc);
      if(p.fin) await Store.mergeFinancial(p.year, p.fin.plan, p.fin.actual, p.filename);
      await Store.saveFile({filename:p.filename, hash:p.hash, year:p.year, month:p.month,
        uploadedAt:nowStr(), rowCount:p.raw.recordCount,
        totalMH:Math.round(p.raw.totalMH*10)/10, baseHours:p.raw.baseHours, status:"반영"});
      S.sel={y:p.year, m:p.month}; S.pending=null; S.tab="dash";
      toast(p.year+"년 "+p.month+"월 데이터가 반영되었습니다.");
      renderAll();
    }catch(e){ /* Store가 이미 toast 처리 */ }
  },
  async saveOverrides(field){
    const {y,m}=S.admSel;
    const reason=($("#reason_"+field).value||"").trim();
    const {plan, actual}=getFin(y);
    const changes=[];
    for(const [item] of ITEMS){
      const raw=($("#ov_"+field+"_"+item).value||"").trim();
      if(!raw) continue;
      const val=Number(raw.replace(/,/g,""));
      if(isNaN(val)){ toast(ITEM_LABEL[item]+": '"+raw+"'는 숫자가 아닙니다."); return; }
      changes.push({item, val});
    }
    if(!changes.length){ toast("수정할 값을 입력하십시오."); return; }
    if(!reason){ toast("수정 사유는 필수 입력입니다."); return; }
    try{
      for(const c of changes){
        const orig=(field==="actual"?actual:plan)[c.item][m-1];
        await Store.addOverride({year:y, month:m, item:c.item, field,
          originalValue:orig, overrideValue:c.val, reason,
          modifiedBy:S.adminName||"admin", modifiedAt:nowStr(), active:true});
      }
      toast("수정값이 저장되었습니다. Dashboard에 즉시 반영됩니다.");
      renderAll();
    }catch(e){}
  },
  async cancelOv(id){ try{ await Store.cancelOverride(id); toast("수정이 취소되었습니다 (이력은 보존됩니다)."); }catch(e){} },
  delConfirm(key){ S.delConfirm=key; renderAll(); },
  async deleteMonth(y,m){
    try{
      await Store.deleteMonth(y,m);
      S.delConfirm=null;
      toast(y+"년 "+m+"월 데이터가 삭제되었습니다.");
      renderAll();
    }catch(e){}
  },
  /* GitHub 게시용 data.json 저장 (현재 데이터 전체) */
  async downloadDataJson(){
    const payload=JSON.stringify({months:S.months, financial:S.financial,
      overrides:S.overrides, files:S.files});
    let dl=null;
    try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads"); }catch(e){}
    if(dl){
      try{ await dl.save({filename:"data.json", data:payload});
        toast("data.json 저장 완료. GitHub 저장소의 data.json을 이 파일로 교체(Commit)하십시오.", 6000); }
      catch(e){ if(e&&e.code==="declined") return;
        toast("저장이 완료되지 않았습니다."); }
      return;
    }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"}));
    a.download="data.json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast("data.json 다운로드 완료. GitHub 저장소의 data.json을 교체하십시오.", 6000);
  },
  async exportExcel(){
    if(!S.sel) return;
    const {y,m}=S.sel;
    const wb=XLSX.utils.book_new();
    const tt=teamTable(S.months[mkey(y,m)],"전체","기본순서");
    const fs=finSummary(y,m); const rs=ratioSeries(y);
    const sum=[["Engineering Monthly Dashboard", plabel(y,m)],[],
      ["지표","값"],["FE 포함 여부", S.feInclude?"포함":"제외"],
      ["총 입력 MH", tt.total],
      ["수행 WORKLOAD율(%)", tt.division["수행"]?+tt.division["수행"].pct.toFixed(2):null],
      ["공사원가율(인건비) 실적(%)", rs.actual[m-1]==null?"미입력":+rs.actual[m-1].toFixed(2)],
      ...fs.rows.map(r=>[r.label+" 실적(백만원)", r.mActual==null?"미입력":+r.mActual.toFixed(1)])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), "Executive Summary");
    const twl=[["팀","총 MH",...tt.cats.flatMap(c=>[c+" MH",c+" %"])],
      [TOTAL_LABEL, +tt.total.toFixed(1),
        ...tt.cats.flatMap(c=>[+(tt.division[c]?tt.division[c].mh:0).toFixed(1),
          +(tt.division[c]?tt.division[c].pct:0).toFixed(1)])],
      ...tt.teams.map(t=>[t.name+(ANALYSIS_EXCLUDE.includes(t.name)?" (분석 제외)":""),
        +t.total.toFixed(1),
        ...tt.cats.flatMap(c=>[+(t.catMH[c]||0).toFixed(1), +t.pct[c].toFixed(1)])])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(twl), "Team Workload");
    const projDoc=S.months[mkey(y,m)];
    if(projDoc && projDoc.projects && projDoc.projects.length){
      const tot=tt.total||projDoc.totalMH||1;
      const adjX=(p,c)=>Math.max(0,(p.mh[c]||0)-(!S.feInclude?((p.fe&&p.fe[c])||0):0));
      const pjs=[["프로젝트(활동 구분)","수행 MH","지원 MH","합계 MH","LOAD율 %"],
        ...projDoc.projects.map(p=>{
          const su=adjX(p,"수행"), ji=adjX(p,"지원");
          return [p.name, +su.toFixed(1), +ji.toFixed(1),
            +(su+ji).toFixed(1), +((su+ji)/tot*100).toFixed(1)];
        }).filter(r=>r[3]>0)];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pjs), "Project Load");
    }
    const fin=[["구분","월 계획","월 실적","증감","누계 계획","누계 실적","누계 증감","누계 기준"],
      ...fs.rows.map(r=>[r.label, r.mPlan, r.mActual??"미입력", r.mVar??"-", r.yPlan, r.yActual, r.yVar??"-", r.basis?("1~"+r.basis+"월"):"-"])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(fin), "Financial");
    const trend=[["연월","총 MH",...CATS.map(c=>c+" %")]];
    for(const p of periods()){ const t=teamTable(S.months[p.key],"전체","기본순서");
      trend.push([plabel(p.y,p.m), +t.total.toFixed(1), ...CATS.map(c=>t.division[c]?+t.division[c].pct.toFixed(2):0)]); }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(trend), "Monthly Trend");
    const out=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    try{ await dl.save({filename:"dashboard_"+y+String(m).padStart(2,"0")+".xlsx", data:out}); toast("Excel 파일이 저장되었습니다."); }
    catch(e){ if(e && e.code==="declined") return; toast("저장이 완료되지 않았습니다."); }
  },
};

/* ---------- init ---------- */
renderAll();
Store.init();
(async()=>{ try{
  if(window.claude && window.claude.use){
    const dl=await window.claude.use("downloads");
    if(dl){ S.canDownload=true; renderAll(); }
  }
}catch(e){} })();
</script>

</body>
