<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Monthly Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F6F7F9; --panel:#FFFFFF; --panel2:#F9FAFB; --line:#E4E7EC; --line2:#F0F2F5;
  --ink:#161B24; --ink2:#5B6474; --ink3:#8D95A5;
  --accent:#1F4E78; --accent-soft:#EAF1F7;
  --v-blue:#1F4E78; --v-red:#C00000; --v-neutral:#6B7280;
  --warn:#B45309; --warn-bg:#FDF4E3; --warn-line:#F2DFB9;
  --ok:#2E7D4F; --chip:#EEF1F5;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --grid:#EDF0F4; --tip-bg:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --panel:#1A2029; --panel2:#1F2630; --line:#2A3240; --line2:#242B36;
    --ink:#E9ECF2; --ink2:#A8B0BF; --ink3:#6E7787;
    --accent:#7FB1E0; --accent-soft:#22303F;
    --v-blue:#7FB1E0; --v-red:#F07A7A; --v-neutral:#8D95A5;
    --warn:#E0A84E; --warn-bg:#2A2416; --warn-line:#4A3D1F;
    --ok:#6FBF8F; --chip:#242B36;
    --shadow:none; --grid:#232A35; --tip-bg:#242B36;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --panel:#1A2029; --panel2:#1F2630; --line:#2A3240; --line2:#242B36;
  --ink:#E9ECF2; --ink2:#A8B0BF; --ink3:#6E7787;
  --accent:#7FB1E0; --accent-soft:#22303F;
  --v-blue:#7FB1E0; --v-red:#F07A7A; --v-neutral:#8D95A5;
  --warn:#E0A84E; --warn-bg:#2A2416; --warn-line:#4A3D1F;
  --ok:#6FBF8F; --chip:#242B36;
  --shadow:none; --grid:#232A35; --tip-bg:#242B36;
}
/* ============ base ============ */
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink);
  font:14px/1.55 "IBM Plex Sans KR","Malgun Gothic",sans-serif;}
.mono{font-family:"IBM Plex Mono",Consolas,monospace}
.num{font-variant-numeric:tabular-nums}
button{font:inherit; cursor:pointer}
select,input[type=text],input[type=search]{
  font:inherit; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:7px; padding:6px 10px;}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.wrap{max-width:1640px; margin:0 auto; padding:18px 26px 60px}
/* ============ topbar ============ */
.topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:18px; flex-wrap:wrap}
.brand h1{margin:0; font-size:24px; font-weight:700; letter-spacing:-.3px; text-wrap:balance}
.brand .sub{font-size:12.5px; color:var(--ink2); margin-top:2px}
.controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.controls select{min-width:86px}
.meta{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink3);
  text-align:right; margin-top:6px; width:100%}
.rule{border:none; border-top:1px solid var(--line); margin:12px 0 16px}
.badge-admin{font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--warn);
  background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:4px;
  padding:2px 7px; vertical-align:3px; margin-left:8px}
.store-chip{font-size:10.5px; letter-spacing:.04em; color:var(--ink3);
  border:1px solid var(--line); border-radius:20px; padding:2px 9px}
/* toggle */
.toggle{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink2); cursor:pointer; user-select:none}
.toggle .tr{width:34px; height:19px; border-radius:10px; background:var(--line); position:relative; transition:background .15s}
.toggle .tr::after{content:""; position:absolute; top:2px; left:2px; width:15px; height:15px;
  border-radius:50%; background:var(--panel); transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on .tr{background:var(--accent)}
.toggle.on .tr::after{left:17px}
/* nav */
.tabs{display:flex; gap:2px; margin-top:14px; border-bottom:1px solid var(--line)}
.tabs button{background:none; border:none; padding:8px 14px 9px; font-size:13.5px; color:var(--ink2);
  border-bottom:2px solid transparent; margin-bottom:-1px}
.tabs button.on{color:var(--ink); font-weight:700; border-bottom-color:var(--accent)}
body.exec .tabs, body.exec .hide-exec{display:none !important}
/* ============ KPI ============ */
.kpis{display:grid; grid-template-columns:repeat(7,1fr); gap:12px; margin:16px 0 14px}
.kpis4{grid-template-columns:repeat(4,1fr)}
.kpi-col{display:flex; flex-direction:column; gap:12px}
.kpi-col .kpi{flex:1}
.kpi-span{display:flex; flex-direction:column; justify-content:center}
@media(max-width:820px){.kpis4{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:15px 17px 12px; box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px; color:var(--ink2)}
.kpi .v{font-size:29px; font-weight:700; letter-spacing:-.5px; line-height:1.15; margin-top:4px}
.kpi .v .u{font-size:12.5px; font-weight:500; color:var(--ink2); margin-left:4px}
.kpi .s{font-size:11.5px; margin-top:5px; color:var(--ink3)}
.kpi .s.blue{color:var(--v-blue); font-weight:700}
.kpi .s.red{color:var(--v-red); font-weight:700}
/* ============ panels & sections ============ */
.grid{display:grid; grid-template-columns:3fr 2fr; gap:16px; align-items:start}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; box-shadow:var(--shadow)}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px}
.sec-h h2{margin:0; font-size:15.5px; font-weight:700}
.sec-h .sub{font-size:11.5px; color:var(--ink3)}
.banner{background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn);
  border-radius:8px; padding:9px 14px; font-size:13px; margin:0 0 14px}
.section-gap{height:16px}
/* ============ workload bars ============ */
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin:2px 0 12px}
.legend .it{display:inline-flex; align-items:center; gap:6px}
.legend .sw{width:11px; height:11px; border-radius:3px}
/* 가로 Stacked Bar — 축 20px / 데이터 레이블 18px, 화면 폭에 따라 비율 축소 */
.wl-row{display:grid; grid-template-columns:clamp(88px,10vw,130px) 1fr clamp(60px,6.5vw,88px);
  gap:10px; align-items:center; margin:9px 0}
.wl-team{font-size:clamp(13px,1.5vw,20px); color:var(--ink2); text-align:right;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wl-row.total .wl-team{font-weight:700; color:var(--ink)}
.wl-row.total{padding-bottom:11px; border-bottom:1px solid var(--line); margin-bottom:11px}
.wl-bar{display:flex; gap:2px; height:clamp(26px,3vw,38px); border-radius:6px; overflow:hidden}
.wl-sum{font-size:clamp(12px,1.35vw,18px); font-weight:700; color:var(--ink2); white-space:nowrap}
.wl-row.total .wl-sum{color:var(--ink)}
.axis-x{display:grid; grid-template-columns:clamp(88px,10vw,130px) 1fr clamp(60px,6.5vw,88px);
  gap:10px; margin-top:2px}
.axis-x .ticks{display:flex; justify-content:space-between;
  font-size:clamp(13px,1.5vw,20px); font-weight:700; color:var(--ink2)}
.wl-seg{display:flex; align-items:center; justify-content:center; min-width:0; cursor:pointer}
.wl-seg span{font-size:clamp(12px,1.35vw,18px); font-weight:600; color:#FFF; white-space:nowrap}
.wl-seg.sel{box-shadow:inset 0 0 0 2px var(--ink)}
/* 범례 변형: center=가운데정렬, sp=항목 간 넓은 간격, lg2=+2pt, big=+3pt */
.legend.center{justify-content:center}
.legend.sp{gap:36px}
.legend.lg2{font-size:14px}
.legend.lg2 .sw{width:12px; height:12px}
.legend.big{font-size:15px}
.legend.big .sw{width:13px; height:13px}
.wlv{display:flex; gap:10px; margin-top:6px}
.wlv-y{display:flex; flex-direction:column; justify-content:space-between;
  height:260px; font-size:10.5px; color:var(--ink3); text-align:right;
  flex:none; width:36px; padding-right:2px}
.wlv-main{flex:1; min-width:0}
.wlv-plot{display:grid; gap:14px; height:260px; align-items:end;
  border-bottom:1px solid var(--line);
  background:linear-gradient(to top, var(--line2) 1px, transparent 1px);
  background-size:100% 20%}
.wlv-stack{display:flex; flex-direction:column; justify-content:flex-end;
  height:100%; position:relative}
.wlv-sum{font-size:clamp(12px,1.35vw,18px); font-weight:700; color:var(--ink2);
  text-align:center; margin-bottom:3px}
.wlv-seg{display:flex; align-items:center; justify-content:center;
  border-radius:3px; margin-top:2px; min-height:2px}
.wlv-seg span{font-size:11px; font-weight:600; color:#FFF; white-space:nowrap}
.wlv-names{display:grid; gap:14px; margin-top:6px}
.wlv-name{font-size:clamp(13px,1.5vw,20px); color:var(--ink2); text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wlv-name.total{font-weight:700; color:var(--ink)}
/* Modal */
#modal{position:fixed; inset:0; z-index:100}
.modal-bg{position:absolute; inset:0; background:rgba(15,20,28,.45)}
.modal-panel{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  width:min(560px, 92vw); max-height:76vh; display:flex; flex-direction:column;
  box-shadow:0 12px 40px rgba(0,0,0,.25)}
#modal.wide .modal-panel{width:min(1000px, 96vw)}
.modal-h{display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:14px 18px; border-bottom:1px solid var(--line); font-weight:700; font-size:14.5px}
#modal-body{padding:12px 18px 18px; overflow-y:auto}
.wl-detail{background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:10px 14px; margin:2px 0 10px 92px}
.wl-detail-h{display:flex; justify-content:space-between; align-items:center;
  font-size:12.5px; margin-bottom:8px; gap:10px}
.wl-detail-items{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:4px 18px}
.wl-detail-it{display:flex; justify-content:space-between; gap:10px; font-size:12px;
  border-bottom:1px dashed var(--line2); padding:2px 0}
.wl-detail-it span{color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wl-detail-it b{color:var(--ink)}
.wl-detail-it.etc span{font-style:italic; color:var(--ink3)}
/* 수행 프로젝트별 LOAD율 */
.pj-row{display:grid; grid-template-columns:clamp(150px,28vw,460px) 1fr clamp(58px,6.5vw,88px);
  gap:10px; align-items:center; margin:7px 0; cursor:pointer; border-radius:6px}
.pj-row.sel{background:var(--accent-soft)}
.pj-name{font-size:clamp(13px,1.5vw,20px); color:var(--ink2); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; text-align:right}
.pj-track{height:clamp(20px,2.4vw,28px); display:flex; gap:2px; align-items:stretch}
.pj-seg{border-radius:4px; min-width:2px; cursor:inherit}
.pj-pct{font-size:clamp(12px,1.35vw,18px); font-weight:600; color:var(--ink2); text-align:left}
/* ============ fin table ============ */
table.fin{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px}
table.fin th{background:var(--panel2); color:var(--ink2); font-weight:600; font-size:11.5px;
  padding:6px 8px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); text-align:center}
table.fin th.gl{border-left:1px solid var(--line)}
table.fin td{padding:7px 8px; border-bottom:1px solid var(--line2); text-align:right; white-space:nowrap}
table.fin td.cat{text-align:left; font-weight:600; color:var(--ink2); white-space:nowrap}
table.fin td.var{font-weight:700}
table.fin td.miss{color:var(--ink3); font-size:11.5px}
.fin-note{font-size:11px; color:var(--ink3); margin-top:7px}
.ovmark{color:var(--warn); font-weight:700}
.u2{font-size:10px; color:var(--ink3); margin-left:2px; font-weight:400}
/* ============ charts ============ */
.chart{position:relative}
.chart svg{display:block; width:100%; height:auto}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--panel); color:var(--ink2);
  border-radius:16px; padding:3px 12px; font-size:12px}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600}
/* ============ insight ============ */
.insights{display:flex; flex-direction:column; gap:6px}
.insight{display:flex; gap:10px; align-items:baseline; font-size:13px}
.insight .ic{font-size:9px; flex:none}
/* ============ tables (detail) ============ */
table.data{width:100%; border-collapse:collapse; font-size:12.5px}
table.data th{background:var(--panel2); color:var(--ink2); font-weight:600; font-size:11.5px;
  padding:6px 9px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap}
table.data th:first-child, table.data td:first-child{text-align:left}
table.data td{padding:6px 9px; border-bottom:1px solid var(--line2); text-align:right; white-space:nowrap}
.tbl-scroll{overflow-x:auto}
/* ============ buttons ============ */
.btn{border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:7px; padding:7px 14px; font-size:13px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
:root[data-theme="dark"] .btn.pri, .btn.pri{color:#fff}
.btn.pri:disabled{opacity:.45; cursor:not-allowed}
.btn.sm{padding:4px 10px; font-size:12px}
/* ============ upload ============ */
.drop{border:1.5px dashed var(--line); border-radius:10px; padding:34px 20px; text-align:center;
  color:var(--ink2); background:var(--panel2); cursor:pointer}
.drop.on{border-color:var(--accent); background:var(--accent-soft)}
.qlist{display:flex; flex-direction:column; gap:5px; font-size:12.5px}
.q-ok{color:var(--ok)} .q-warn{color:var(--warn)} .q-err{color:var(--v-red)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 14px; font-size:12.5px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
/* ============ misc ============ */
.empty{ text-align:center; padding:80px 0; color:var(--ink2)}
.empty b{display:block; font-size:17px; color:var(--ink); margin-bottom:6px}
details.drill{margin-top:16px}
details.drill summary{cursor:pointer; font-size:13px; color:var(--ink2); padding:6px 0}
#tip{position:fixed; z-index:50; pointer-events:none; background:var(--tip-bg);
  border:1px solid var(--line); border-radius:8px; padding:8px 11px; font-size:12px;
  box-shadow:0 4px 14px rgba(0,0,0,.13); display:none; max-width:260px}
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:60;
  background:var(--ink); color:var(--bg); border-radius:8px; padding:9px 18px;
  font-size:13px; display:none; max-width:80vw}
.form-row{display:grid; grid-template-columns:1.1fr .9fr .9fr 1fr; gap:10px; align-items:center;
  padding:7px 0; border-bottom:1px solid var(--line2); font-size:13px}
.form-row .lab{font-weight:600; color:var(--ink2)}
.muted{color:var(--ink3)}
.small{font-size:12px}
@media print{
  .tabs,.controls,.hide-print,#toast,#tip{display:none !important}
  body{background:#fff}
  .panel,.kpi{box-shadow:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
<style>body{margin:0} [hidden]{display:none!important} img{max-width:100%}</style>

<body>


<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <h1>Engineering Monthly Management Dashboard<span id="adminBadge"></span></h1>
      <div class="sub">Engineering Division · Monthly Executive Review</div>
    </div>
    <div class="controls" id="controls"></div>
    <div class="meta" id="meta"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"><div class="empty">데이터 연결 중…</div></main>
</div>
<div id="tip"></div>
<div id="toast"></div>
<div id="modal" hidden>
  <div class="modal-bg" onclick="App.closeModal()"></div>
  <div class="modal-panel">
    <div class="modal-h"><span id="modal-title"></span>
      <button class="btn sm" onclick="App.closeModal()">닫기 ✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* =====================================================================
   Engineering Monthly Management Dashboard  (browser-only, no server)
   Excel(.xlsm/.xlsx) → SheetJS parsing → 정규화 → 공유 DB(또는 로컬 저장)
   원본 Excel은 절대 수정하지 않으며, 관리자 수정은 Override로 분리 보존.
===================================================================== */

/* ---------- constants ---------- */
const CATS = ["수행","지원","일반","견적"];
const UNKNOWN = "미분류";
const CAT_MAP = {"수행":"수행","지원":"지원","일반":"일반","하자보수":"일반","견적":"견적","영업":"견적"};
const CAT_COLORS = {"수행":"#1F4E78","지원":"#5B9BD5","일반":"#A5A5A5","견적":"#ED7D31","미분류":"#C55A5A"};
const ITEMS = [["labor_cost","인건비(공사원가)"],["labor_sga","인건비(판관비)"],["admin_expense","관리비(경비)"]];
const ITEM_LABEL = Object.fromEntries(ITEMS);
const FIN_EXCEL = {"원가":"labor_cost","판관비":"labor_sga","경비":"admin_expense"};
const TEAM_PALETTE = ["#1F4E78","#5B9BD5","#ED7D31","#2E7D4F","#7A4FA3","#C00000","#8A6D1A","#5A6472"];
const LABEL_MIN = 5.0, ABNORMAL_MH = 300, WON_THRESHOLD = 1e7;
const MONTH_RE = /^(\d{1,2})\s*월$/;
/* WORKLOAD 분석(팀별 Bar/순위)에서 제외하는 팀 — '전체' 집계에는 항상 포함 */
const ANALYSIS_EXCLUDE = ["기술기획팀"];
const TOTAL_LABEL = "전체";
/* 팀 고정 정렬 순서 (기본순서). 목록에 없는 팀은 뒤에 등장 순서대로 */
const TEAM_ORDER = ["공정팀","기계팀","배관팀","전기팀","계장팀","토건팀","공조소방팀"];
const teamRank = n => { const i = TEAM_ORDER.indexOf(n); return i >= 0 ? i : 100; };
/* 팀별 고유 색 (차분한 톤) — 프로젝트 팀별 투입률 등에서 사용 */
const TEAM_COLORS = {
  "공정팀":"#5B7C99","기계팀":"#8E9BA8","배관팀":"#7A9E9B","전기팀":"#A79178",
  "계장팀":"#9489A8","토건팀":"#B0A489","공조소방팀":"#84A08F","기술기획팀":"#9AA3AF",
};
const teamColor = (n,i)=> TEAM_COLORS[n] || TEAM_PALETTE[i%TEAM_PALETTE.length];
const PROJ_CATS = ["수행","지원"];   // 수행 프로젝트 = 업무구분 수행+지원
const PROJ_MAX_ROWS = 7;

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf0 = v => v==null ? "-" : Number(v).toLocaleString("en-US",{maximumFractionDigits:0});
const nf1 = v => v==null ? "미입력" : Number(v).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1});
const pct1 = v => v==null ? "-" : v.toFixed(1)+"%";
const pp1 = v => v==null ? "-" : (v>=0?"+":"")+v.toFixed(1)+"%p";
const sgn1 = v => v==null ? "-" : (v>=0?"+":"")+Number(v).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1});
const spct = v => v==null ? "-" : (v>=0?"+":"")+v.toFixed(1)+"%";
const mkey = (y,m) => y+"-"+String(m).padStart(2,"0");
const plabel = (y,m) => y+"."+String(m).padStart(2,"0");
function toast(msg, ms=3200){ const t=$("#toast"); t.textContent=msg; t.style.display="block";
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none", ms); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function varColorClass(item, v){
  if(v==null || v===0) return "";
  const inc = v>0;
  if(item==="labor_cost") return inc ? "blue" : "red";
  return inc ? "red" : "blue";
}
function varColorVar(item, v){
  const c = varColorClass(item, v);
  return c==="blue" ? "var(--v-blue)" : c==="red" ? "var(--v-red)" : "var(--v-neutral)";
}

/* ---------- state ---------- */
const S = {
  tab:"dash", sel:null, months:{}, financial:{}, overrides:[], files:{},
  storeMode:null, ready:false, pending:null,
  trendSel:"전체",
  sort:"기본순서", projMode:"수행+지원", wlDetail:null, cumSel:null, cumExpand:false,
  histA:null, histB:null, histFrom:null, histTo:null,
  exec: location.hash==="#exec" || lsGet("emd-exec")!==false,   // 기본: Executive View ON
  adminName: lsGet("emd-admin-name") || "admin",
  canDownload:false,
  feInclude: lsGet("emd-fe")!==false,   // 기본: FE 포함
  projSel:null,
};

/* =====================================================================
   Store — 공유 DB(claude db capability) 우선, 불가 시 브라우저 로컬 저장
===================================================================== */
const Store = {
  db:null, mode:"none",
  async init(){
    let db = null;
    try{ if(window.claude && window.claude.use) db = await window.claude.use("db"); }catch(e){}
    if(db){
      this.db = db; this.mode = "shared"; S.storeMode = "shared";
      const onErr = e => { if(e && e.code!=="unavailable") console.warn("db", e); };
      db.collection("months").onSnapshot(snap => {
        S.months = {}; snap.docs.forEach(d => { if(d.exists) S.months[d.id]=d.data(); });
        S.ready = true; ensureSel(); renderAll();
      }, onErr);
      db.collection("financial").onSnapshot(snap => {
        S.financial = {}; snap.docs.forEach(d => { if(d.exists) S.financial[d.id]=d.data(); });
        renderAll();
      }, onErr);
      db.collection("overrides").onSnapshot(snap => {
        S.overrides = snap.docs.filter(d=>d.exists).map(d => ({id:d.id, ...d.data()}));
        renderAll();
      }, onErr);
      db.collection("files").onSnapshot(snap => {
        S.files = {}; snap.docs.forEach(d => { if(d.exists) S.files[d.id]=d.data(); });
        renderAll();
      }, onErr);
      setTimeout(()=>{ if(!S.ready){ S.ready=true; ensureSel(); renderAll(); } }, 4000);
    }else{
      /* GitHub Pages 등 정적 게시: 같은 경로의 data.json이 있으면
         조회 전용(static)으로 로드. 없으면 브라우저 로컬 저장(local). */
      let staticData=null;
      try{
        const res=await fetch("data.json", {cache:"no-store"});
        if(res.ok) staticData=await res.json();
      }catch(e){}
      if(staticData && staticData.months){
        this.mode="static"; S.storeMode="static";
        S.months=staticData.months||{}; S.financial=staticData.financial||{};
        S.overrides=staticData.overrides||[]; S.files=staticData.files||{};
        S.ready=true; ensureSel(); renderAll();
      }else{
        this.mode = "local"; S.storeMode = "local";
        const d = lsGet("emd-data") || {};
        S.months = d.months||{}; S.financial = d.financial||{};
        S.overrides = d.overrides||[]; S.files = d.files||{};
        S.ready = true; ensureSel(); renderAll();
      }
    }
  },
  _guardStatic(){
    if(this.mode==="static"){
      toast("게시본(조회 전용)에서는 데이터를 변경할 수 없습니다. 원본 Dashboard에서 수정 후 data.json을 다시 게시하십시오.", 5000);
      throw new Error("static read-only");
    }
  },
  _persistLocal(){
    lsSet("emd-data", {months:S.months, financial:S.financial, overrides:S.overrides, files:S.files});
  },
  _werr(e){
    if(e && (e.code==="invalid_argument" || e.code==="not_granted"))
      toast("저장 권한이 없습니다. 이 Artifact의 편집 권한이 있는 계정만 데이터를 변경할 수 있습니다.", 4500);
    else toast("저장 중 오류가 발생했습니다: "+(e && e.message || e), 4500);
    throw e;
  },
  async saveMonth(doc){
    this._guardStatic();
    if(this.mode==="shared"){
      try{ await this.db.doc("months/"+mkey(doc.year,doc.month)).set(doc); }catch(e){ this._werr(e); }
    }else{ S.months[mkey(doc.year,doc.month)] = doc; this._persistLocal(); renderAll(); }
  },
  async mergeFinancial(year, plan, actual, sourceFile){
    this._guardStatic();
    const id = String(year);
    const cur = (this.mode==="shared")
      ? await this.db.doc("financial/"+id).get().then(s=>s.exists?s.data():null).catch(()=>null)
      : (S.financial[id]||null);
    const merged = { year, plan:{}, actual:{}, sourceFile, updatedAt:nowStr() };
    for(const [k] of ITEMS){
      const cp=(cur&&cur.plan&&cur.plan[k])||Array(12).fill(null);
      const ca=(cur&&cur.actual&&cur.actual[k])||Array(12).fill(null);
      const np=(plan&&plan[k])||Array(12).fill(null);
      const na=(actual&&actual[k])||Array(12).fill(null);
      merged.plan[k]  = np.map((v,i)=> v!=null ? v : cp[i]);           // 계획: 새 값 우선
      merged.actual[k]= na.map((v,i)=> v!=null ? v : ca[i]);           // 실적: 입력된 값만 갱신
    }
    if(this.mode==="shared"){
      try{ await this.db.doc("financial/"+id).set(merged); }catch(e){ this._werr(e); }
    }else{ S.financial[id]=merged; this._persistLocal(); renderAll(); }
  },
  async addOverride(o){
    this._guardStatic();
    if(this.mode==="shared"){
      try{
        const dup = S.overrides.filter(x=>x.active && x.year===o.year && x.month===o.month && x.item===o.item && x.field===o.field);
        for(const d of dup) await this.db.doc("overrides/"+d.id).update({active:false});
        await this.db.collection("overrides").add(o);
      }catch(e){ this._werr(e); }
    }else{
      S.overrides.forEach(x=>{ if(x.active && x.year===o.year && x.month===o.month && x.item===o.item && x.field===o.field) x.active=false; });
      S.overrides.push({id:"L"+Date.now(), ...o}); this._persistLocal(); renderAll();
    }
  },
  async cancelOverride(id){
    this._guardStatic();
    if(this.mode==="shared"){
      try{ await this.db.doc("overrides/"+id).update({active:false}); }catch(e){ this._werr(e); }
    }else{
      const o=S.overrides.find(x=>x.id===id); if(o) o.active=false; this._persistLocal(); renderAll();
    }
  },
  async saveFile(doc){
    this._guardStatic();
    if(this.mode==="shared"){
      try{ await this.db.doc("files/"+doc.hash).set(doc); }catch(e){ this._werr(e); }
    }else{ S.files[doc.hash]=doc; this._persistLocal(); renderAll(); }
  },
  async deleteMonth(y,m){
    this._guardStatic();
    /* 해당 월의 WORKLOAD 데이터와 Upload 이력을 삭제.
       재무 연간 데이터(financial)는 다른 월 실적을 포함하므로 유지한다. */
    const key=mkey(y,m);
    if(this.mode==="shared"){
      try{
        await this.db.doc("months/"+key).delete();
        const fs=await this.db.collection("files")
          .where("year","==",y).where("month","==",m).get();
        for(const d of fs.docs) await this.db.doc("files/"+d.id).delete();
      }catch(e){ this._werr(e); }
    }else{
      delete S.months[key];
      for(const [h,f] of Object.entries({...S.files}))
        if(f.year===y && f.month===m) delete S.files[h];
      this._persistLocal(); ensureSel(); renderAll();
    }
  },
};
function nowStr(){ const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }

/* =====================================================================
   계산 Logic (Python 버전과 동일 산식)
===================================================================== */
function periods(){ return Object.keys(S.months).sort().map(k=>({key:k, y:+k.slice(0,4), m:+k.slice(5)})); }
function ensureSel(){
  const ps = periods();
  if(!ps.length){ S.sel=null; return; }
  if(!S.sel || !S.months[mkey(S.sel.y,S.sel.m)]) S.sel = {y:ps[ps.length-1].y, m:ps[ps.length-1].m};
}
function prevPeriod(y,m){ return m===1 ? {y:y-1,m:12} : {y,m:m-1}; }

function stValues(doc){
  const set = new Set();
  (doc.teams||[]).forEach(t => Object.keys(t.st||{}).forEach(s=>set.add(s)));
  return [...set].sort();
}
/* 팀별 Category MH/비율.  stFilter 적용 시 분자/분모 동일 조건 */
function teamTable(doc, stFilter, sort){
  if(!doc) return {teams:[], cats:CATS.slice(), total:0, division:{}};
  let hasUnknown = false;
  const teams = (doc.teams||[]).map(t=>{
    const catMH = {}; let total = 0;
    for(const [st, cats] of Object.entries(t.st||{})){
      if(stFilter && stFilter!=="전체" && st!==stFilter) continue;
      if(!S.feInclude && st==="FE") continue;   // FE 제외 Toggle (모든 데이터 공통)
      for(const [c,v] of Object.entries(cats)){
        catMH[c]=(catMH[c]||0)+v; total+=v;
        if(c===UNKNOWN && v>0) hasUnknown=true;
      }
    }
    return {name:t.name, order:t.order, total, catMH};
  }).filter(t=>t.total>0);
  const cats = CATS.slice(); if(hasUnknown) cats.push(UNKNOWN);
  teams.forEach(t=>{
    t.pct = {}; cats.forEach(c=>{ t.pct[c] = t.total>0 ? (t.catMH[c]||0)/t.total*100 : 0; });
  });
  if(sort==="수행율 높은순") teams.sort((a,b)=>b.pct["수행"]-a.pct["수행"]);
  else if(sort==="일반율 높은순") teams.sort((a,b)=>b.pct["일반"]-a.pct["일반"]);
  else if(sort==="총 MH 높은순") teams.sort((a,b)=>b.total-a.total);
  else teams.sort((a,b)=>(teamRank(a.name)-teamRank(b.name)) || (a.order-b.order));
  const total = teams.reduce((s,t)=>s+t.total,0);
  const division = {};
  cats.forEach(c=>{ const mh = teams.reduce((s,t)=>s+(t.catMH[c]||0),0);
    division[c] = {mh, pct: total>0 ? mh/total*100 : 0}; });
  return {teams, cats, total, division};
}

function getFin(year){
  const d = S.financial[String(year)];
  const empty = () => Object.fromEntries(ITEMS.map(([k])=>[k, Array(12).fill(null)]));
  if(!d) return {plan:empty(), actual:empty()};
  const norm = src => Object.fromEntries(ITEMS.map(([k])=>[k, (src&&src[k]||Array(12).fill(null)).map(v=>v==null?null:v)]));
  return {plan:norm(d.plan), actual:norm(d.actual)};
}
function activeOv(year){ return S.overrides.filter(o=>o.active && o.year===year); }
function applyOv(plan, actual, ovs){
  const p = Object.fromEntries(ITEMS.map(([k])=>[k, plan[k].slice()]));
  const a = Object.fromEntries(ITEMS.map(([k])=>[k, actual[k].slice()]));
  for(const o of ovs){
    if(!(o.month>=1 && o.month<=12) || !(o.item in p)) continue;
    (o.field==="plan" ? p : a)[o.item][o.month-1] = o.overrideValue;
  }
  return {plan:p, actual:a};
}
function ytdBasis(series, selM){
  let b=0; for(let m=1;m<=selM;m++){ if(series[m-1]==null) break; b=m; } return b;
}
/* 재무 요약: 월/누계, 동일기간 비교, Override 적용 */
function finSummary(year, month){
  const {plan, actual} = getFin(year);
  const ovs = activeOv(year);
  const {plan:P, actual:A} = applyOv(plan, actual, ovs);
  const rows=[]; const bases=new Set(); let missing=false;
  for(const [item,label] of ITEMS){
    const mPlan=P[item][month-1], mActual=A[item][month-1];
    const mVar=(mPlan!=null&&mActual!=null)? mActual-mPlan : null;
    const basis=ytdBasis(A[item], month);
    let yPlan=null,yActual=null,yVar=null;
    if(basis>0){
      const ps=P[item].slice(0,basis), as=A[item].slice(0,basis);
      if(ps.every(v=>v!=null)) yPlan=ps.reduce((s,v)=>s+v,0);
      yActual=as.reduce((s,v)=>s+(v||0),0);
      if(yPlan!=null) yVar=yActual-yPlan;
      bases.add(basis);
    }
    const ovA=ovs.find(o=>o.month===month&&o.item===item&&o.field==="actual");
    const ovP=ovs.find(o=>o.month===month&&o.item===item&&o.field==="plan");
    if(mActual==null) missing=true;
    rows.push({item,label,mPlan,mActual,mVar,basis,yPlan,yActual,yVar,
      ovA:!!ovA, ovP:!!ovP, origA:ovA?ovA.originalValue:null, origP:ovP?ovP.originalValue:null});
  }
  let basisNote;
  if(!bases.size) basisNote="누계 기준 : 실적 입력 없음";
  else if(bases.size===1) basisNote="누계 기준 : 1~"+[...bases][0]+"월";
  else basisNote="누계 기준 : "+rows.filter(r=>r.basis>0).map(r=>r.label+" 1~"+r.basis+"월").join(", ");
  return {rows, missing, basisNote, month};
}
function ratio(cost,sga){ if(cost==null||sga==null) return null; const d=cost+sga; return d===0?null:cost/d*100; }
function ratioSeries(year){
  const {plan, actual} = getFin(year);
  const {plan:P, actual:A} = applyOv(plan, actual, activeOv(year));
  return {
    plan: Array.from({length:12},(_,i)=>ratio(P.labor_cost[i],P.labor_sga[i])),
    actual: Array.from({length:12},(_,i)=>ratio(A.labor_cost[i],A.labor_sga[i])),
  };
}

/* Rule 기반 Insight — 수치 변화/비중/순위/계획대비/Missing만 생성 */
function insights(y,m){
  const out=[];
  const cur=teamTable(S.months[mkey(y,m)],"전체","기본순서");
  const pv=prevPeriod(y,m);
  const prevDoc=S.months[mkey(pv.y,pv.m)];
  const prev=prevDoc?teamTable(prevDoc,"전체","기본순서"):null;
  const perf=cur.division["수행"]?cur.division["수행"].pct:null;
  if(perf!=null){
    if(prev && prev.division["수행"])
      out.push(["n","수행 WORKLOAD "+pct1(perf)+", 전월 대비 "+pp1(perf-prev.division["수행"].pct)]);
    else out.push(["n","수행 WORKLOAD "+pct1(perf)+" (전월 데이터 없음)"]);
  }
  const anTeams=cur.teams.filter(t=>!ANALYSIS_EXCLUDE.includes(t.name));
  if(anTeams.length){
    const tg=[...anTeams].sort((a,b)=>b.pct["일반"]-a.pct["일반"])[0];
    if(tg && tg.pct["일반"]>0) out.push(["i",tg.name+" 일반업무 비중 "+pct1(tg.pct["일반"])+"로 본부 내 최고"]);
    const tq=[...anTeams].sort((a,b)=>b.pct["견적"]-a.pct["견적"])[0];
    if(tq && tq.pct["견적"]>0) out.push(["i",tq.name+" 견적/영업 비중 "+pct1(tq.pct["견적"])+"로 본부 내 최고"]);
  }
  if(cur.total && prev && prev.total){
    const chg=(cur.total-prev.total)/prev.total*100;
    out.push(["n","총 MH "+nf0(cur.total)+", 전월 대비 "+Math.abs(chg).toFixed(1)+"% "+(chg>=0?"증가":"감소")]);
  }
  const fs=finSummary(y,m);
  for(const r of fs.rows){
    if(r.mVar!=null && r.mVar!==0)
      out.push(["c",r.label+" "+m+"월 실적 계획대비 "+nf1(Math.abs(r.mVar))+"백만원 "+(r.mVar>0?"증가":"감소")]);
  }
  const missing=fs.rows.filter(r=>r.mActual==null).map(r=>r.label);
  if(missing.length) out.push(["c",m+"월 재무 실적 데이터 미입력 ("+missing.join(", ")+")"]);
  if(cur.division[UNKNOWN] && cur.division[UNKNOWN].mh>0)
    out.push(["c","미분류 업무구분 "+nf0(cur.division[UNKNOWN].mh)+" MH ("+pct1(cur.division[UNKNOWN].pct)+") - Mapping 확인 필요"]);
  return out;
}

/* =====================================================================
   Excel Parsing (SheetJS) — 위치 Hard Coding 없이 Label 탐색
===================================================================== */
const COL_ALIAS = {
  department:["부서"], employee_id:["사번"], employee_name:["작성자"],
  work_date:["작업일자"], st:["st","ST","St"], work_type:["업무 구분","업무구분"],
  activity:["활동 구분","활동구분"], input_hours:["입력시간"],
};
function normCat(v){ const s=String(v??"").trim(); return CAT_MAP[s] || UNKNOWN; }
function parseDateCell(v){
  if(v instanceof Date && !isNaN(v)) return {y:v.getFullYear(), m:v.getMonth()+1};
  const s=String(v??"").trim(); if(!s) return null;
  let m=s.match(MONTH_RE); if(m) return {y:null, m:+m[1]};
  m=s.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/); if(m) return {y:+m[1], m:+m[2]};
  return null;
}
async function sha256(buf){
  const h=await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function parseRawSheet(ws){
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  let headerIdx=-1, colMap={};
  for(let i=0;i<Math.min(rows.length,30);i++){
    const cells=(rows[i]||[]).map(v=>String(v??"").trim());
    if(cells.includes("부서") && cells.some(c=>c.includes("입력시간"))){
      headerIdx=i;
      for(const [key,aliases] of Object.entries(COL_ALIAS)){
        const j=cells.findIndex(c=>aliases.includes(c));
        if(j>=0) colMap[key]=j;
      }
      break;
    }
  }
  if(headerIdx<0) throw new Error("원데이터 Sheet에서 Header 행('부서','입력시간')을 찾을 수 없습니다.");
  for(const req of ["department","work_date","work_type","input_hours"])
    if(!(req in colMap)) throw new Error("원데이터 필수 Column을 찾을 수 없습니다: "+COL_ALIAS[req][0]);
  // 기준월/기준시간: Header 위쪽의 숫자 Cell 탐색 (G1/G2 또는 I2/I3 등 위치 무관)
  let baseMonth=null, baseHours=null;
  for(let i=0;i<headerIdx;i++){
    for(const v of (rows[i]||[])){
      if(typeof v!=="number") continue;
      if(baseMonth==null && Number.isInteger(v) && v>=1 && v<=12) baseMonth=v;
      else if(baseHours==null && v>=100 && v<=400) baseHours=v;
    }
  }
  // 데이터 행
  const order={}, teamStCat={}, teamCatAct={}, teamCatActFE={},
    yearsCount={}, monthsCount={}, projAgg={};
  let recordCount=0, totalMH=0, nullHours=0, neg=0, big=0, nullDept=0, nullWT=0, mismatch=0;
  const workTypes=new Set(), unknownTypes=new Set();
  for(let i=headerIdx+1;i<rows.length;i++){
    const r=rows[i]||[];
    const dept=r[colMap.department], wt=r[colMap.work_type], hours=r[colMap.input_hours];
    if(dept==null && hours==null && wt==null) continue;
    recordCount++;
    const deptS=String(dept??"").trim();
    if(!deptS) nullDept++;
    const wtS=String(wt??"").trim();
    if(!wtS) nullWT++; else workTypes.add(wtS);
    const cat=normCat(wt);
    if(cat===UNKNOWN && wtS) unknownTypes.add(wtS);
    const h=(typeof hours==="number")?hours:(hours!=null&&hours!==""&&!isNaN(+hours)?+hours:null);
    if(h==null){ nullHours++; }
    else{
      totalMH+=h; if(h<0) neg++; if(h>ABNORMAL_MH) big++;
      const team=deptS||"(부서없음)";
      if(!(team in order)) order[team]=Object.keys(order).length;
      const stS=String(r[colMap.st]??"").trim()||"(없음)";
      const bucket=(teamStCat[team]??={}); const stB=(bucket[stS]??={});
      stB[cat]=(stB[cat]||0)+h;
      const act=colMap.activity!=null
        ? (String(r[colMap.activity]??"").trim()||"(활동구분 없음)") : null;
      const isFE = stS==="FE";
      if(act!=null){
        // 팀 × Category × 활동구분 내역 (+ FE분)
        const tb=(teamCatAct[team]??={}); const cb=(tb[cat]??={});
        cb[act]=(cb[act]||0)+h;
        if(isFE){
          const tf=(teamCatActFE[team]??={}); const cf=(tf[cat]??={});
          cf[act]=(cf[act]||0)+h;
        }
        // 수행 프로젝트별 집계 (업무구분 수행/지원 × 활동 구분, 팀별·FE분 포함)
        if(PROJ_CATS.includes(wtS)){
          const pb=(projAgg[act]??={mh:{}, fe:{}, teams:{}, teamsFE:{}});
          pb.mh[wtS]=(pb.mh[wtS]||0)+h;
          const tm=(pb.teams[team]??={}); tm[wtS]=(tm[wtS]||0)+h;
          if(isFE){
            pb.fe[wtS]=(pb.fe[wtS]||0)+h;
            const tmf=(pb.teamsFE[team]??={}); tmf[wtS]=(tmf[wtS]||0)+h;
          }
        }
      }
    }
    const d=parseDateCell(r[colMap.work_date]);
    if(d){ if(d.y) yearsCount[d.y]=(yearsCount[d.y]||0)+1;
           if(d.m){ monthsCount[d.m]=(monthsCount[d.m]||0)+1; } }
  }
  const modeOf=o=>{ let k=null,c=-1; for(const [key,n] of Object.entries(o)) if(n>c){c=n;k=+key;} return k; };
  const month = baseMonth ?? modeOf(monthsCount);
  if(month!=null){
    // 기준월 확정 후 불일치 건수 재계산
    for(const [m,c] of Object.entries(monthsCount)) if(+m!==month) mismatch+=c;
  }
  let year=null;
  if(Object.keys(yearsCount).length){
    year=modeOf(yearsCount);
  }
  const teams=Object.entries(order).sort((a,b)=>a[1]-b[1])
    .map(([name,ord])=>({name, order:ord, st:teamStCat[name]||{},
      detail:teamCatAct[name]||{}, detailFE:teamCatActFE[name]||{}}));
  const two=o=>({수행:(o&&o["수행"])||0, 지원:(o&&o["지원"])||0});
  const projects=Object.entries(projAgg)
    .map(([name,p])=>({name, mh:two(p.mh), fe:two(p.fe),
      teams:Object.fromEntries(Object.entries(p.teams).map(([t,v])=>[t,two(v)])),
      teamsFE:Object.fromEntries(Object.entries(p.teamsFE).map(([t,v])=>[t,two(v)]))}))
    .sort((a,b)=>(b.mh.수행+b.mh.지원)-(a.mh.수행+a.mh.지원));
  return {teams, projects, month, year, baseHours, recordCount, totalMH,
    quality:{nullHours,neg,big,nullDept,nullWT,mismatch,
      workTypes:[...workTypes].sort(), unknownTypes:[...unknownTypes].sort()}};
}
function parseFinSheet(wb, name){
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
  const findRow=labels=>{
    for(let i=0;i<Math.min(rows.length,80);i++){
      const j=(rows[i]||[]).findIndex(v=>labels.includes(String(v??"").trim()));
      if(j>=0) return {i,j};
    } return null;
  };
  const planH=findRow(["월별 예산","월별 계획"]);
  const actH=findRow(["월별 실적"]);
  if(!planH||!actH) throw new Error("'"+name+"' Sheet에서 '월별 예산'/'월별 실적' Label을 찾을 수 없습니다.");
  const monthCols=hr=>{
    const map={}; (rows[hr]||[]).forEach((v,j)=>{
      const m=String(v??"").trim().match(MONTH_RE);
      if(m && +m[1]>=1 && +m[1]<=12 && !(+m[1] in map)) map[+m[1]]=j; });
    return map;
  };
  const readBlock=(h)=>{
    const cols=monthCols(h.i);
    const out=Object.fromEntries(ITEMS.map(([k])=>[k,Array(12).fill(null)]));
    for(let i=h.i+1;i<=Math.min(h.i+8,rows.length-1);i++){
      const lab=String((rows[i]||[])[h.j]??"").replace(/\s/g,"");
      const item=FIN_EXCEL[lab]; if(!item) continue;
      for(const [m,cj] of Object.entries(cols)){
        const v=(rows[i]||[])[cj];
        out[item][m-1]=(typeof v==="number")?v:(v!=null&&v!==""&&!isNaN(+v)?+v:null);
      }
    }
    return out;
  };
  let plan=readBlock(planH), actual=readBlock(actH);
  const all=[...Object.values(plan),...Object.values(actual)].flat().filter(v=>v!=null);
  if(all.length && Math.max(...all.map(Math.abs))>WON_THRESHOLD){
    const div=o=>{ for(const k in o) o[k]=o[k].map(v=>v==null?null:v/1e6); };
    div(plan); div(actual);
  }
  // 실적 미입력 정규화: 최신 실적월 이후의 0/Blank → null
  let latest=0;
  for(let m=12;m>=1;m--){ if(ITEMS.some(([k])=>actual[k][m-1]!=null && actual[k][m-1]!==0)){ latest=m; break; } }
  for(const [k] of ITEMS) for(let m=latest+1;m<=12;m++) actual[k][m-1]=null;
  const ym=name.match(/^(\d{4})년/);
  return {sheetName:name, sheetYear:ym?+ym[1]:null, plan, actual, latestActual:latest};
}
async function parseWorkbook(buffer, filename){
  const hash=await sha256(buffer.slice(0));
  const wb=XLSX.read(buffer, {type:"array", cellDates:true});
  if(!wb.Sheets["원데이터"]) throw new Error("필수 Sheet '원데이터'를 찾을 수 없습니다.");
  const raw=parseRawSheet(wb.Sheets["원데이터"]);
  const finSheets=wb.SheetNames.filter(n=>/^\d{4}년.*예산.*판관비/.test(n));
  let year=raw.year;
  if(year==null && finSheets.length){
    const ys=finSheets.map(n=>+n.match(/^(\d{4})년/)[1]).sort();
    year=ys[ys.length-1]; // 후보 중 최신 연도를 제안 (사용자 확인 필수)
  }
  let finChoice=null;
  if(finSheets.length){
    finChoice=finSheets.find(n=>n.startsWith(String(year)+"년")) || (finSheets.length===1?finSheets[0]:null);
  }
  let fin=null, finError=null;
  if(finChoice){ try{ fin=parseFinSheet(wb, finChoice); }catch(e){ finError=e.message; } }
  return {wb, hash, filename, raw, finSheets, finChoice, fin, finError,
    yearGuess:year, monthGuess:raw.month, yearFromDates:raw.year!=null};
}
function buildQuality(p, year, month){
  const q=[]; const r=p.raw, Q=r.quality;
  const add=(name,status,detail)=>q.push({name,status,detail});
  add("원데이터 Sheet","ok", nf0(r.recordCount)+"행 인식");
  add("팀 인식", r.teams.length?"ok":"err", r.teams.length+"개 팀 확인");
  add("입력시간", Q.nullHours? "warn":"ok", Q.nullHours? nf0(Q.nullHours)+"건 누락/비숫자":"전체 숫자 확인");
  add("음수 MH", Q.neg?"warn":"ok", Q.neg? nf0(Q.neg)+"건":"없음");
  add("비정상 MH", Q.big?"warn":"ok", Q.big? ABNORMAL_MH+" MH 초과 "+nf0(Q.big)+"건":"없음");
  add("부서 누락", Q.nullDept?"warn":"ok", Q.nullDept? nf0(Q.nullDept)+"건":"없음");
  add("업무구분", (Q.nullWT||Q.unknownTypes.length)?"warn":"ok",
    (Q.nullWT||Q.unknownTypes.length)
      ? [(Q.nullWT? "누락 "+nf0(Q.nullWT)+"건":""), (Q.unknownTypes.length? "미정의: "+Q.unknownTypes.join(", "):"")].filter(Boolean).join(" / ")+" → '미분류' 처리"
      : Q.workTypes.length+"종 확인");
  add("작업일자-기준월", Q.mismatch?"warn":"ok", Q.mismatch? "기준월 외 일자 "+nf0(Q.mismatch)+"건":"일치");
  if(!p.yearFromDates) add("기준 연도","warn","작업일자에 연도 정보가 없어 자동 추정 - 확인 필요");
  if(!p.fin) add("재무 데이터","warn", p.finError || "예산/실적 Sheet 미인식");
  else{
    add("예산 데이터","ok","'"+p.fin.sheetName+"' 인식");
    const entered=ITEMS.some(([k])=>p.fin.actual[k][month-1]!=null);
    add("실적 데이터", entered?"ok":"warn", entered? month+"월 실적 확인": month+"월 재무 실적 미입력");
    if(p.fin.sheetYear && p.fin.sheetYear!==year)
      add("재무 Sheet 연도","warn","Sheet 연도("+p.fin.sheetYear+")와 대상 연도("+year+") 불일치");
  }
  return q;
}

/* =====================================================================
   SVG Charts (line / bar) — crosshair + tooltip
===================================================================== */
const chartReg = {};
let chartSeq = 0;
let wlModalData = null, projModalData = null;   // 팝업(전체 내역) 데이터
function svgLine(opts){
  // opts: {series:[{name,color,dash,markers,faint,width,axis:'y2'?,values[]}],
  //        labels[], ySuffix, h, hl(1-based idx|null)}
  const id="ch"+(++chartSeq); chartReg[id]=opts;
  const has2=opts.series.some(s=>s.axis==="y2");
  const AXF=opts.bigAxis? `font-size="18" font-weight="700" fill="var(--ink2)"`
                        : `font-size="10" fill="var(--ink3)"`;
  const LBS=opts.labelSize||11.5;
  const W=opts.w||720, H=opts.h||240, L=opts.bigAxis?80:46, R=has2?(opts.bigAxis?84:50):14,
    T=opts.pointLabels?(LBS>=18?40:(LBS>=14?30:26)):12, B=opts.bigAxis?40:26;
  const iw=W-L-R, ih=H-T-B;
  const scaleOf=list=>{
    const vals=list.flatMap(s=>s.values).filter(v=>v!=null);
    let lo=vals.length?Math.min(...vals):0, hi=vals.length?Math.max(...vals):1;
    if(lo===hi){ lo-=1; hi+=1; }
    const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
    return {lo, hi};
  };
  const s1=opts.series.filter(s=>s.axis!=="y2");
  const s2=opts.series.filter(s=>s.axis==="y2");
  let {lo, hi}=scaleOf(s1.length?s1:opts.series);
  if(opts.yDomain){ lo=opts.yDomain[0]; hi=opts.yDomain[1]; }
  else if(opts.zeroBase && lo>0) lo=0;
  let lo2=0, hi2=1;
  if(has2){
    if(opts.y2Domain){ lo2=opts.y2Domain[0]; hi2=opts.y2Domain[1]; }
    else{ const sc2=scaleOf(s2); lo2=Math.min(0,sc2.lo); hi2=sc2.hi; }
  }
  const n=opts.labels.length;
  const X=i=> L + (n===1? iw/2 : i*(iw/(n-1)));
  const Y=v=> T + ih - (v-lo)/(hi-lo)*ih;
  const Y2=v=> T + ih - (v-lo2)/(hi2-lo2)*ih;
  const ticks=[]; const step=opts.yDomain? (hi-lo)/5 : niceStep((hi-lo)/4);
  for(let t=Math.ceil(lo/step)*step; t<=hi+1e-9; t+=step) ticks.push(t);
  let g="";
  ticks.forEach(t=>{ const y=Y(t);
    g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    g+=`<text x="${L-7}" y="${y+4}" text-anchor="end" ${AXF}>${fmtTick(t)}${opts.ySuffix||""}</text>`; });
  if(has2){
    const step2=opts.y2Domain? (hi2-lo2)/5 : niceStep((hi2-lo2)/4);
    for(let t=Math.ceil(lo2/step2)*step2; t<=hi2+1e-9; t+=step2)
      g+=`<text x="${W-R+7}" y="${Y2(t)+4}" text-anchor="start" ${AXF}>${fmtTick(t)}${opts.ySuffix||""}</text>`;
  }
  const lblEvery=Math.ceil(n/12);
  opts.labels.forEach((lb,i)=>{ if(i%lblEvery) return;
    g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" ${AXF}>${esc(lb)}</text>`; });
  if(opts.hl!=null && opts.hl>=1 && opts.hl<=n)
    g+=`<line x1="${X(opts.hl-1)}" x2="${X(opts.hl-1)}" y1="${T}" y2="${T+ih}" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 3"/>`;
  for(const s of opts.series){
    const YY=s.axis==="y2"?Y2:Y;
    let path="", run=false;
    s.values.forEach((v,i)=>{
      if(v==null){ run=false; return; }
      path+=(run?"L":"M")+X(i).toFixed(1)+" "+YY(v).toFixed(1)+" "; run=true;
    });
    g+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.2}" ${s.dash?`stroke-dasharray="5 4"`:""} ${s.faint?`opacity="0.75"`:""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.markers!==false)
      s.values.forEach((v,i)=>{ if(v==null) return;
        g+=`<circle cx="${X(i).toFixed(1)}" cy="${YY(v).toFixed(1)}" r="3" fill="${s.color}" stroke="var(--panel)" stroke-width="1.5"/>`; });
  }
  /* Data Labels (pos: above/below) — 양끝은 축과 겹치지 않게 anchor 보정 */
  if(opts.pointLabels)
    for(const pl of opts.pointLabels){
      const yy=(pl.axis==="y2"?Y2:Y)(pl.v)+(pl.pos==="above"? -(LBS*0.75) : LBS+5);
      const anc=pl.i===0?"start":(pl.i===n-1?"end":"middle");
      const dx=pl.i===0?3:(pl.i===n-1?-3:0);
      g+=`<text x="${(X(pl.i)+dx).toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="${anc}" font-size="${LBS}" font-weight="600" fill="${pl.color}">${esc(pl.text)}</text>`;
    }
  g+=`<line id="${id}-cross" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="var(--ink3)" stroke-width="1" opacity="0"/>`;
  chartReg[id]._geo={W,H,L,R,T,B,iw,ih,n};
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="chart">${g}</svg></div>`;
}
function niceStep(raw){
  const p=Math.pow(10, Math.floor(Math.log10(Math.abs(raw)||1)));
  const r=raw/p;
  return (r<=1?1:r<=2?2:r<=5?5:10)*p;
}
function fmtTick(t){ return Math.abs(t)>=1000 ? nf0(t) : (Math.round(t*10)/10).toLocaleString("en-US"); }
function svgBars(opts){
  // opts: {values[], labels[], color, h, suffix}
  const id="ch"+(++chartSeq); chartReg[id]={...opts, bar:true};
  const W=720, H=opts.h||240, L=52, R=14, T=12, B=26;
  const iw=W-L-R, ih=H-T-B;
  const vals=opts.values.filter(v=>v!=null);
  const hi=vals.length?Math.max(...vals)*1.1:1;
  const n=opts.labels.length, bw=Math.min(46, iw/n*0.55);
  const X=i=> L + (i+0.5)*(iw/n);
  const Y=v=> T + ih - v/hi*ih;
  let g="";
  const step=niceStep(hi/4);
  for(let t=0;t<=hi+1e-9;t+=step){ const y=Y(t);
    g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`;
    g+=`<text x="${L-7}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--ink3)">${fmtTick(t)}</text>`; }
  opts.labels.forEach((lb,i)=>{
    g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink3)">${esc(lb)}</text>`;
    const v=opts.values[i]; if(v==null) return;
    g+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw}" height="${(T+ih-Y(v)).toFixed(1)}" rx="4" fill="${opts.color||"var(--accent)"}"/>`;
  });
  chartReg[id]._geo={W,H,L,R,T,B,iw,ih,n};
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="bar chart">${g}</svg></div>`;
}
function bindCharts(root){
  root.querySelectorAll("[data-chart]").forEach(el=>{
    const id=el.dataset.chart, spec=chartReg[id]; if(!spec) return;
    const svg=el.querySelector("svg"), tip=$("#tip");
    el.addEventListener("mousemove", ev=>{
      const r=svg.getBoundingClientRect(), geo=spec._geo;
      const fx=(ev.clientX-r.left)/r.width*geo.W;
      const n=geo.n;
      let i=Math.round((fx-geo.L)/(n===1?1:geo.iw/(n-1)));
      if(spec.bar) i=Math.floor((fx-geo.L)/(geo.iw/n));
      if(i<0||i>=n){ tip.style.display="none"; return; }
      const cross=svg.querySelector(`#${id}-cross`);
      if(cross){ const X=geo.L+(n===1?geo.iw/2:i*(geo.iw/(n-1)));
        cross.setAttribute("x1",X); cross.setAttribute("x2",X); cross.setAttribute("opacity",".45"); }
      let html=`<b>${esc(spec.labels[i])}</b><br>`;
      if(spec.bar){ html+= esc(spec.name||"")+" "+nf0(spec.values[i])+(spec.suffix||""); }
      else{
        for(const s of spec.series){
          const v=s.values[i];
          html+=`<span style="color:${s.color}">●</span> ${esc(s.name)} : ${v==null?"미입력":(spec.fmt?spec.fmt(v):v.toFixed(1)+(spec.ySuffix||""))}<br>`;
        }
        if(spec.extra) html+=spec.extra(i)||"";
      }
      tip.innerHTML=html; tip.style.display="block";
      tip.style.left=Math.min(ev.clientX+14, innerWidth-tip.offsetWidth-8)+"px";
      tip.style.top=(ev.clientY+14)+"px";
    });
    el.addEventListener("mouseleave", ()=>{ $("#tip").style.display="none";
      const cross=svg.querySelector(`#${id}-cross`); if(cross) cross.setAttribute("opacity","0"); });
  });
}
